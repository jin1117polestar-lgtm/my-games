<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE NEON PINBALL</title>
    <style>
        /* コピペやメニューを完全に禁止 */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #wrapper { position: relative; max-width: 400px; margin: 0 auto; height: 100vh; background: #050010; }
        canvas { width: 100%; height: 100%; display: block; }
        .ui-panel {
            position: absolute; top: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(0, 255, 255, 0.1); border-bottom: 2px solid #0ff;
            color: #0ff; font-weight: bold; z-index: 10;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .btn {
            padding: 20px 40px; font-size: 20px; background: #0ff; color: #000;
            border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px #0ff;
        }
        #fever {
            position: absolute; top: 40%; width: 100%; text-align: center;
            color: #ff0; font-size: 40px; display: none; pointer-events: none;
            text-shadow: 0 0 20px #f0f; z-index: 50;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <div id="wrapper">
    <div class="ui-panel">
        <div>SCORE<div id="score">0</div></div>
        <div>MEDAL<div id="medals">0</div></div>
        <div>BALL<div id="balls">3</div></div>
    </div>
    
    <div id="fever">FEVER!</div>
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="overlay">
        <h1 style="color:#0ff; text-shadow:0 0 10px #0ff;">NEON PINBALL</h1>
        <button id="start-btn" class="btn">START</button>
        <button onclick="debug()" style="background:none; border:none; color:#333; margin-top:20px;">CODE</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 400, H = 700;
canvas.width = W; canvas.height = H;

// --- 物理設計 ---
const ball = { x: 375, y: 640, vx: 0, vy: 0, r: 9, active: false, pull: 0, isPulling: false };
const GRAVITY = 600, FRICTION = 0.995, BOUNCE = 0.6;
let score = 0, medals = 0, balls = 3, combo = 0, fever = 0, debugWin = false;

let walls = [], flippers = [], bumpers = [], coins = [];
let slot = { v: [0,0,0], active: false, timers: [0,0,0] };

function initField() {
    walls = [
        {x1: 10, y1: 0, x2: 10, y2: 600}, // 左
        {x1: 10, y1: 600, x2: 130, y2: 680}, // 左傾斜
        {x1: 390, y1: 0, x2: 390, y2: 650}, // 右外
        {x1: 355, y1: 150, x2: 355, y2: 650}, // 発射レーン壁
        {x1: 355, y1: 650, x2: 270, y2: 680}, // 右傾斜
        {x1: 10, y1: 0, x2: 340, y2: 0}, // 天井
        {x1: 340, y1: 0, x2: 390, y2: 50}, // コーナー
        {x1: 355, y1: 50, x2: 355, y2: 150, sensor: true} // 逆流防止（センサー化）
    ];
    flippers = [
        {x: 130, y: 680, len: 75, angle: 0.2, target: 0.2, side: -1},
        {x: 270, y: 680, len: 75, angle: -0.2, target: -0.2, side: 1}
    ];
    bumpers = [
        {x: 200, y: 180, r: 30, color: '#f0f'},
        {x: 100, y: 300, r: 25, color: '#0f0'},
        {x: 300, y: 300, r: 25, color: '#0f0'}
    ];
}

// --- メインループ ---
let last = performance.now();
function loop(now) {
    let dt = (now - last) / 1000;
    if (dt > 0.1) dt = 0.1;
    last = now;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

function update(dt) {
    if (fever > 0) fever -= dt;
    else document.getElementById('fever').style.display = 'none';

    // スロット更新
    if (slot.active) {
        slot.timers.forEach((t, i) => {
            if (t > 0) {
                slot.timers[i] -= dt;
                slot.v[i] = Math.floor(Math.random() * 10);
            } else if (debugWin) slot.v[i] = 7;
        });
        if (slot.timers[2] <= 0 && slot.v[0]===7 && slot.v[1]===7 && slot.v[2]===7) {
            fever = 15; document.getElementById('fever').style.display = 'block';
        }
    }

    // プランジャー蓄積
    if (ball.isPulling) ball.pull = Math.min(150, ball.pull + dt * 250);

    // フリッパー動作
    flippers.forEach(f => {
        f.angle += (f.target - f.angle) * 25 * dt;
    });

    if (ball.active) {
        ball.vy += GRAVITY * dt;
        ball.vx *= FRICTION; ball.vy *= FRICTION;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;

        // 壁判定
        walls.forEach(w => {
            if (!w.sensor) collide(ball, w);
        });

        // フリッパー判定
        flippers.forEach(f => {
            const x2 = f.x + Math.cos(f.angle) * f.len * f.side;
            const y2 = f.y + Math.sin(f.angle) * f.len * f.side;
            collide(ball, {x1: f.x, y1: f.y, x2: x2, y2: y2}, (f.target !== f.angle));
        });

        // バンパー判定
        bumpers.forEach(b => {
            let dx = ball.x - b.x, dy = ball.y - b.y, dist = Math.sqrt(dx*dx+dy*dy);
            if (dist < ball.r + b.r) {
                let nx = dx/dist, ny = dy/dist;
                ball.x = b.x + nx*(ball.r+b.r);
                let dot = ball.vx*nx + ball.vy*ny;
                ball.vx = (ball.vx - 2*dot*nx) * 1.5;
                ball.vy = (ball.vy - 2*dot*ny) * 1.5;
                score += 100 * (fever > 0 ? 5 : 1);
            }
        });

        // スロットチェッカー（弾かないように判定のみ）
        if (Math.abs(ball.x - 200) < 30 && Math.abs(ball.y - 450) < 30 && !slot.active) {
            slot.active = true;
            slot.timers = [1.5, 2.5, 3.5];
            spawnCoins(200, 450);
        }

        if (ball.y > 720) {
            balls--;
            if (balls <= 0) location.reload();
            else resetBall();
        }
    }

    // コイン更新
    coins.forEach((c, i) => {
        c.vy += GRAVITY * dt; c.x += c.vx * dt; c.y += c.vy * dt;
        if (c.y > 700) { coins.splice(i,1); medals++; score += 50; }
    });

    document.getElementById('score').innerText = Math.floor(score);
    document.getElementById('medals').innerText = medals;
    document.getElementById('balls').innerText = balls;
}

function collide(b, l, hit=false) {
    let dx = l.x2 - l.x1, dy = l.y2 - l.y1, len = dx*dx + dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x-l.x1)*dx + (b.y-l.y1)*dy) / len));
    let cx = l.x1 + t*dx, cy = l.y1 + t*dy;
    let dist = Math.sqrt((b.x-cx)**2 + (b.y-cy)**2);
    if (dist < b.r) {
        let nx = (b.x-cx)/dist, ny = (b.y-cy)/dist;
        b.x = cx + nx*b.r; b.y = cy + ny*b.r;
        let dot = b.vx*nx + b.vy*ny;
        b.vx = (b.vx - 2*dot*nx) * BOUNCE;
        b.vy = (b.vy - 2*dot*ny) * BOUNCE;
        if (hit) b.vy -= 600; // フリッパーで叩き上げる
    }
}

function spawnCoins(x, y) {
    for(let i=0; i<8; i++) coins.push({x:x, y:y, vx:(Math.random()-0.5)*200, vy:-200});
}

function resetBall() {
    ball.active = false; ball.x = 373; ball.y = 630; ball.vx = 0; ball.vy = 0; ball.pull = 0;
}

function draw() {
    ctx.clearRect(0,0,W,H);
    
    // コイン（背景）
    ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
    coins.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI*2); ctx.fill(); });

    // 壁
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 4;
    ctx.beginPath();
    walls.forEach(w => { if(!w.sensor){ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2);} });
    ctx.stroke();

    // スロット
    ctx.fillStyle = '#fff'; ctx.font = '30px Arial';
    ctx.fillText(slot.v.join(' '), 160, 100);

    // バンパー
    bumpers.forEach(b => {
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    });

    // フリッパー
    ctx.strokeStyle = '#ff0'; ctx.lineWidth = 10;
    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.angle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len * f.side, 0); ctx.stroke();
        ctx.restore();
    });

    // ボール
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

    // プランジャー可視化
    ctx.fillStyle = '#444'; ctx.fillRect(360, 650 + (ball.pull/2), 30, 50);
}

// --- 入力制御 ---
const startBtn = document.getElementById('start-btn');
startBtn.addEventListener('pointerdown', () => {
    document.getElementById('start-screen').style.display = 'none';
    initField(); resetBall();
    requestAnimationFrame(loop);
});

window.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    if (x > 340 && !ball.active) ball.isPulling = true;
    else {
        if (x < 200) flippers[0].target = -0.6;
        else flippers[1].target = 0.6;
    }
});

window.addEventListener('pointerup', () => {
    if (ball.isPulling) {
        ball.vy = -ball.pull * 10; // 威力を大幅アップ
        ball.vx = -50;
        ball.active = true; ball.isPulling = false;
    }
    flippers[0].target = 0.2;
    flippers[1].target = -0.2;
});

function debug() {
    let p = prompt("CODE?");
    if (p === "7777") { debugWin = true; alert("DEBUG ON"); }
}
</script>
</body>
</html>

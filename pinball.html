<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALAXY PACHIN-BALL: OVERDRIVE</title>
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; margin: 0; overflow: hidden; font-family: 'Verdana', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #main-container { position: relative; width: 450px; height: 800px; background: #050510; border: 4px solid #444; overflow: hidden; box-shadow: 0 0 50px rgba(0,255,255,0.3); }
        
        .ui-layer {
            position: absolute; top: 0; width: 100%; height: 70px;
            background: rgba(0,0,0,0.8); border-bottom: 2px solid #0ff;
            display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000;
        }
        .ui-box { display: flex; flex-direction: column; justify-content: center; align-items: center; border-right: 1px solid #222; }
        .ui-val { font-size: 18px; color: #fff; text-shadow: 0 0 10px #0ff; font-weight: bold; }
        .ui-lbl { font-size: 9px; color: #0ff; }

        #slot-display {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 60px; background: #000; border: 2px solid #f0f;
            border-radius: 10px; display: flex; justify-content: space-around; align-items: center; z-index: 900;
            box-shadow: 0 0 15px #f0f;
        }
        .reel { font-size: 32px; color: #fff; font-weight: bold; width: 50px; text-align: center; }
        .reel.rolling { animation: reelBlur 0.1s infinite; }
        @keyframes reelBlur { 0% { opacity: 0.5; transform: translateY(-2px); } 100% { opacity: 1; transform: translateY(2px); } }

        canvas { position: absolute; top: 0; left: 0; z-index: 10; }

        #boot-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .start-btn {
            padding: 25px 50px; font-size: 24px; background: #0ff; border: none;
            border-radius: 50px; font-weight: bold; color: #000; cursor: pointer;
            box-shadow: 0 0 30px #0ff;
        }
    </style>
</head>
<body>

<div id="main-container">
    <div class="ui-layer">
        <div class="ui-box"><span class="ui-lbl">SCORE</span><span id="v-score" class="ui-val">0</span></div>
        <div class="ui-box"><span class="ui-lbl">MEDAL</span><span id="v-medal" class="ui-val">0</span></div>
        <div class="ui-box"><span class="ui-lbl">BALL</span><span id="v-ball" class="ui-val">5</span></div>
        <div class="ui-box"><span class="ui-lbl">CHANCE</span><span id="v-chance" class="ui-val">0</span></div>
    </div>

    <div id="slot-display">
        <div id="r0" class="reel">7</div>
        <div id="r1" class="reel">7</div>
        <div id="r2" class="reel">7</div>
    </div>

    <canvas id="stage"></canvas>

    <div id="boot-screen">
        <h2 style="color:#0ff; margin-bottom:30px;">GALAXY PACHIN-BALL</h2>
        <button id="start-btn" class="start-btn">START MISSION</button>
    </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = 450, H = 800;
canvas.width = W; canvas.height = H;

let score = 0, medal = 0, balls = 5, chance = 0, active = false;
let fever = 0;

const ball = { x: 420, y: 740, vx: 0, vy: 0, r: 9, inPlay: false, pull: 0, isPulling: false, history: [] };
let walls = [], bumpers = [], flippers = [], pins = [], particles = [], effects = [];
const slot = { rolling: false, res: [7,7,7], timers: [0,0,0] };

function initField() {
    // 左右の斜面（水色の台）を大幅に短縮し、中央の穴を広げる
    walls = [
        {x1: 10, y1: 150, x2: 10, y2: 650, c: '#0ff'},
        {x1: 10, y1: 650, x2: 100, y2: 720, c: '#0ff'}, // 左斜面：短く
        {x1: 440, y1: 150, x2: 440, y2: 750, c: '#0ff'},
        {x1: 390, y1: 200, x2: 390, y2: 750, c: '#0ff'},
        {x1: 390, y1: 750, x2: 350, y2: 720, c: '#0ff'}, // 右斜面：短く
        {x1: 10, y1: 150, x2: 120, y2: 20, c: '#0ff'},
        {x1: 120, y1: 20, x2: 330, y2: 20, c: '#0ff'},
        {x1: 330, y1: 20, x2: 440, y2: 110, c: '#0ff'},
        {x1: 390, y1: 150, x2: 440, y2: 100, c: '#444', isGate: true}
    ];

    // フリッパー：間隔を広げ、中央への落下を誘発
    flippers = [
        {x: 140, y: 765, len: 80, angle: 0.5, target: 0.5, base: 0.5, side: 'L'},
        {x: 310, y: 765, len: 80, angle: -0.5, target: -0.5, base: -0.5, side: 'R'}
    ];

    // バンパー配置（中央にスロット始動用の入賞口）
    bumpers = [
        {x: 225, y: 400, r: 25, c: '#ff0', type: 'chance', label: 'CHANCE'},
        {x: 100, y: 250, r: 30, c: '#0ff', type: 'bumper'},
        {x: 350, y: 250, r: 30, c: '#0ff', type: 'bumper'}
    ];

    // パチンコ釘の実装：中央エリアに配置
    pins = [];
    for(let row=0; row<5; row++) {
        for(let col=0; col<6; col++) {
            pins.push({ x: 100 + col*50 + (row%2)*25, y: 480 + row*40, r: 4 });
        }
    }
}

function update(dt) {
    if (!active) return;
    
    const steps = 8; // 速度を落とし精度を維持
    const sdt = dt / steps;

    for(let s=0; s<steps; s++) {
        if (ball.inPlay) {
            ball.vy += 1200 * sdt; // 重力を少し軽減し、滞空時間を増やす
            ball.vx *= 0.999; ball.vy *= 0.999;
            ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;

            walls.forEach(w => { if(!(w.isGate && ball.vy < 0)) resolveWall(ball, w); });
            pins.forEach(p => resolveCircle(ball, p, 0.6)); // 釘との衝突
            
            bumpers.forEach(b => {
                let dx = ball.x - b.x, dy = ball.y - b.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < ball.r + b.r) {
                    if (b.type === 'chance') {
                        if (!slot.rolling) { startSlot(); chance++; }
                        createEffect(b.x, b.y, "FLASH");
                    }
                    let nx = dx/dist, ny = dy/dist;
                    ball.x = b.x + nx*(ball.r+b.r);
                    let dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx) * 1.5;
                    ball.vy = (ball.vy - 2*dot*ny) * 1.5;
                    score += 100;
                }
            });

            flippers.forEach(f => {
                const d = f.side === 'L' ? 1 : -1;
                const x2 = f.x + Math.cos(f.angle)*f.len*d, y2 = f.y + Math.sin(f.angle)*f.len*d;
                resolveWall(ball, {x1: f.x, y1: f.y, x2: x2, y2: y2}, Math.abs(f.angle-f.target)>0.1 ? 1200 : 0);
            });
        }
    }

    if (ball.isPulling) ball.pull = Math.min(120, ball.pull + dt * 250);
    flippers.forEach(f => f.angle += (f.target - f.angle) * 30 * dt);

    if (slot.rolling) {
        slot.timers.forEach((t, i) => {
            if (t > 0) {
                slot.timers[i] -= dt;
                slot.res[i] = Math.floor(Math.random()*10);
            }
            document.getElementById('r'+i).innerText = slot.res[i];
        });
        if (slot.timers[2] <= 0) {
            if (slot.res.every(v => v === 7)) triggerFever();
            if (slot.timers[2] < -1) slot.rolling = false;
        }
    }

    if (ball.y > H + 50) {
        balls--; if(balls < 0) { alert("GameOver"); location.reload(); } else resetBall();
    }
    updateUI();
}

function resolveWall(b, l, kick=0) {
    let dx = l.x2-l.x1, dy = l.y2-l.y1, lenSq = dx*dx+dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x-l.x1)*dx+(b.y-l.y1)*dy)/lenSq));
    let cx = l.x1+t*dx, cy = l.y1+t*dy;
    let dist = Math.sqrt((b.x-cx)**2+(b.y-cy)**2);
    if (dist < b.r) {
        let nx = (b.x-cx)/dist, ny = (b.y-cy)/dist;
        b.x = cx+nx*(b.r+0.5); b.y = cy+ny*(b.r+0.5);
        let dot = b.vx*nx+b.vy*ny;
        if(dot < 0) { b.vx = (b.vx-2*dot*nx)*0.6; b.vy = (b.vy-2*dot*ny)*0.6; }
        if(kick > 0) { b.vy -= kick; b.vx += (b.x-l.x1)*2; }
    }
}

function resolveCircle(b, p, bounce) {
    let dx = b.x - p.x, dy = b.y - p.y, dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < b.r + p.r) {
        let nx = dx/dist, ny = dy/dist;
        b.x = p.x + nx*(b.r+p.r);
        let dot = b.vx*nx + b.vy*ny;
        if(dot < 0) { b.vx = (b.vx-2*dot*nx)*bounce; b.vy = (b.vy-2*dot*ny)*bounce; }
    }
}

function draw() {
    ctx.clearRect(0,0,W,H);
    
    // フィールド背景光（演出用）
    if(slot.rolling) {
        ctx.fillStyle = 'rgba(255, 0, 255, 0.05)';
        ctx.fillRect(0,0,W,H);
    }

    walls.forEach(w => {
        ctx.strokeStyle = w.c; ctx.lineWidth = 4; ctx.beginPath();
        ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    });

    pins.forEach(p => {
        ctx.fillStyle = '#aaa'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    });

    bumpers.forEach(b => {
        ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(b.label || '', b.x, b.y+5);
    });

    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.angle);
        ctx.strokeStyle = '#ff0'; ctx.lineWidth = 14; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len*(f.side==='L'?1:-1), 0); ctx.stroke();
        ctx.restore();
    });

    // ボール
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // バネ
    ctx.fillStyle = '#444'; ctx.fillRect(405, 750 + ball.pull, 30, 100);

    effects.forEach((ef, i) => {
        ctx.strokeStyle = `rgba(255,255,255,${ef.life})`;
        ctx.beginPath(); ctx.arc(ef.x, ef.y, (1-ef.life)*100, 0, Math.PI*2); ctx.stroke();
        ef.life -= 0.05; if(ef.life<=0) effects.splice(i,1);
    });
}

function startSlot() {
    slot.rolling = true; slot.timers = [1.5, 2.2, 3.0];
    document.querySelectorAll('.reel').forEach(el => el.classList.add('rolling'));
}
function triggerFever() { medal += 50; score += 5000; alert("FEVER! MEDAL +50"); }
function createEffect(x,y,t) { effects.push({x:x, y:y, life:1}); }
function resetBall() { ball.inPlay=false; ball.x=420; ball.y=740; ball.vx=0; ball.vy=0; ball.pull=0; ball.history=[]; }
function updateUI() {
    document.getElementById('v-score').innerText = score;
    document.getElementById('v-medal').innerText = medal;
    document.getElementById('v-ball').innerText = balls;
    document.getElementById('v-chance').innerText = chance;
}

const btn = document.getElementById('start-btn');
function start() { document.getElementById('boot-screen').style.display='none'; active=true; initField(); resetBall(); loop(); }
btn.addEventListener('click', start);
btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });

window.addEventListener('touchstart', e => {
    if(!active) return;
    const x = e.touches[0].clientX - canvas.offsetLeft;
    if(x > 380 && !ball.inPlay) ball.isPulling = true;
    else { if(x < W/2) flippers[0].target = -0.7; else flippers[1].target = 0.7; }
}, {passive:false});

window.addEventListener('touchend', () => {
    if(ball.isPulling) {
        ball.vy = -(1000 + ball.pull * 10); ball.vx = -120;
        ball.inPlay = true; ball.isPulling = false;
    }
    flippers.forEach(f => f.target = f.base);
});

function loop() { update(0.016); draw(); requestAnimationFrame(loop); }
</script>
</body>
</html>

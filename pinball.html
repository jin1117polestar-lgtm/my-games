<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NEON PINBALL RUSH</title>
    <style>
        html, body {
            background: #000; color: #fff; text-align: center;
            font-family: 'Press Start 2P', cursive, sans-serif;
            overflow: hidden; touch-action: none; margin: 0; width: 100%; height: 100%;
        }
        @font-face {
            font-family: 'Press Start 2P';
            src: url('https://fonts.gstatic.com/s/pressstart2p/v14/8Lg6Z-HLhE9SL1O_Q6HNCYl_F4M_7k8.woff2') format('woff2');
        }
        #game-container {
            display: flex; flex-direction: column; height: 100vh;
            max-width: 600px; margin: 0 auto; position: relative;
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        .ui-top {
            height: 60px; display: flex; justify-content: space-around; align-items: center;
            background: rgba(17, 17, 17, 0.9); color: #0f0; font-size: 10px;
            border-bottom: 2px solid #333; z-index: 10;
        }
        canvas { display: block; width: 100%; height: 100%; background-color: #0d011c; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        button {
            padding: 15px 30px; font-size: 18px; background: #0f0; border: none;
            border-radius: 30px; margin: 10px; cursor: pointer;
            font-family: 'Press Start 2P'; box-shadow: 0 4px #0a0;
        }
        #fever-overlay {
            position: absolute; top: 30%; width: 100%; color: #ff0;
            font-size: 2.5em; text-shadow: 0 0 20px #f0f; display: none;
            pointer-events: none; z-index: 99;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-top">
        <div>SCORE <br><span id="score">0</span></div>
        <div>MEDALS <br><span id="medals">0</span></div>
        <div>BALLS <br><span id="balls">3</span></div>
        <div>COMBO <br><span id="combo">x1</span></div>
    </div>
    
    <div id="screen-area" style="position:relative; flex-grow:1;">
        <canvas id="gameCanvas" width="400" height="700"></canvas>
        <div id="fever-overlay">FEVER TIME!</div>
        <div id="start-screen" class="overlay">
            <h1 style="color:#0ff; text-shadow:0 0 10px #0ff;">NEON PINBALL</h1>
            <button onclick="startGame()">MISSION START</button>
            <button style="background:#333; color:#888; font-size:10px;" onclick="enterCode()">ENTER CODE</button>
        </div>
        <div id="result-screen" class="overlay" style="display:none">
            <h2 style="color:#f0f;">GAME OVER</h2>
            <div id="final-stats" style="margin-bottom:20px;"></div>
            <button onclick="location.reload()">RETRY</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- ゲーム状態管理 ---
let gameState = "TITLE";
let score = 0;
let ballCount = 3;
let medalCount = 0;
let lastTime = 0;
let shake = 0;
let comboCount = 0;
let feverActive = false;
let feverTimer = 0;

// --- 物理定数 ---
const GRAVITY = { x: 0, y: 350 };
const BOUNCE = 0.75;
const FRICTION = 0.995;
const BALL_RAD = 8;
const FLIPPER_POWER = 500;
const PLUNGER_MAX = 700;

// --- オブジェクト ---
const ball = { x: 375, y: 630, vx: 0, vy: 0, isMoving: false, pull: 0, isPulling: false };
let walls = [], flippers = [], bumpers = [], hoppers = [], medals = [];
let slot = { val: [0, 0, 0], spinning: [false, false, false], timer: [0, 0, 0], active: false };

function initGame() {
    walls = [
        // 左外壁
        {x1: 20, y1: 0, x2: 20, y2: 550},
        {x1: 20, y1: 550, x2: 120, y2: 660},
        // 上壁
        {x1: 20, y1: 0, x2: 340, y2: 0},
        // 右上カーブ（隙間を埋める）
        {x1: 340, y1: 0, x2: 380, y2: 40},
        {x1: 380, y1: 40, x2: 380, y2: 630},
        // 発射レーン内壁（出口開放：y=120まで）
        {x1: 350, y1: 120, x2: 350, y2: 630},
        // 右下傾斜
        {x1: 350, y1: 550, x2: 280, y2: 660}
    ];

    flippers = [
        {px: 130, py: 670, len: 70, angle: 0, side: -1, active: false},
        {px: 270, py: 670, len: 70, angle: 0, side: 1, active: false}
    ];

    bumpers = [
        {x: 200, y: 120, r: 25, score: 100, color: '#0ff'},
        {x: 100, y: 220, r: 20, score: 50, color: '#0f0'},
        {x: 300, y: 220, r: 20, score: 50, color: '#0f0'},
        {x: 200, y: 320, r: 15, score: 30, color: '#f0f'}
    ];

    hoppers = [
        {x: 50, y: 50, w: 40, h: 30, medals: 1, score: 200},
        {x: 300, y: 50, w: 40, h: 30, medals: 1, score: 200},
        {x: 175, y: 220, w: 50, h: 35, medals: 3, score: 500, isSlot: true}
    ];
}

function startGame() {
    document.getElementById("start-screen").style.display = "none";
    initGame(); resetBall();
    gameState = "PLAY";
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function resetBall() {
    ball.x = 365; ball.y = 630; ball.vx = 0; ball.vy = 0;
    ball.isMoving = false; ball.pull = 0; ball.isPulling = false;
    comboCount = 0; updateUI();
}

function update(dt, now) {
    if (shake > 0) shake -= dt * 30;
    if (feverActive) {
        feverTimer -= dt;
        if (feverTimer <= 0) {
            feverActive = false;
            document.getElementById("fever-overlay").style.display = "none";
        }
    }

    // スロット更新
    if (slot.active) {
        for (let i = 0; i < 3; i++) {
            if (slot.spinning[i]) {
                slot.timer[i] -= dt;
                slot.val[i] = Math.floor(Math.random() * 8);
                if (slot.timer[i] <= 0) {
                    slot.spinning[i] = false;
                    slot.val[i] = 7; // 確率演出
                    if (i === 2) checkSlot();
                }
            }
        }
    }

    // フリッパー回転
    flippers.forEach(f => {
        let target = f.active ? f.side * 0.7 : 0;
        f.angle += (target - f.angle) * 18 * dt;
    });

    if (ball.isPulling) ball.pull = Math.min(80, ball.pull + dt * 120);

    if (ball.isMoving) {
        ball.vx += GRAVITY.x * dt; ball.vy += GRAVITY.y * dt;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        ball.vx *= FRICTION; ball.vy *= FRICTION;

        // 壁衝突
        walls.forEach(w => collideLine(ball, w));
        // フリッパー衝突
        flippers.forEach(f => {
            const x2 = f.px + Math.cos(f.angle) * f.len * f.side;
            const y2 = f.py + Math.sin(f.angle) * f.len * f.side;
            collideLine(ball, {x1: f.px, y1: f.py, x2: x2, y2: y2}, f.active ? FLIPPER_POWER : 0);
        });
        // バンパー衝突
        bumpers.forEach(b => {
            let dx = ball.x - b.x, dy = ball.y - b.y, d = Math.sqrt(dx*dx + dy*dy);
            if (d < BALL_RAD + b.r) {
                let nx = dx/d, ny = dy/d;
                ball.x = b.x + nx * (BALL_RAD + b.r);
                let dot = ball.vx*nx + ball.vy*ny;
                ball.vx = (ball.vx - 2*dot*nx) * 1.3;
                ball.vy = (ball.vy - 2*dot*ny) * 1.3;
                addScore(b.score); comboCount++; shake = 10;
            }
        });
        // ホッパー判定
        hoppers.forEach(h => {
            if (ball.x > h.x && ball.x < h.x+h.w && ball.y > h.y && ball.y < h.y+h.h) {
                addScore(h.score); comboCount++; shake = 15;
                if (h.isSlot && !slot.active) startSlot();
                for(let i=0; i<h.medals; i++) spawnMedal(h.x + h.w/2, h.y + h.h);
                ball.vy *= -0.4; // 軽く弾く
            }
        });

        if (ball.y > 750) {
            ballCount--;
            if (ballCount <= 0) endGame(); else resetBall();
        }
    }

    medals.forEach((m, i) => {
        m.vy += GRAVITY.y * dt; m.x += m.vx * dt; m.y += m.vy * dt;
        if (m.y > 690) { medals.splice(i, 1); medalCount++; addScore(150); }
    });
    updateUI();
}

function collideLine(b, l, power=0) {
    let dx = l.x2 - l.x1, dy = l.y2 - l.y1, lenSq = dx*dx + dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x - l.x1) * dx + (b.y - l.y1) * dy) / lenSq));
    let cx = l.x1 + t * dx, cy = l.y1 + t * dy;
    let dist = Math.sqrt((b.x - cx)**2 + (b.y - cy)**2);
    if (dist < BALL_RAD) {
        let nx = (b.x - cx)/dist, ny = (b.y - cy)/dist;
        b.x = cx + nx * BALL_RAD; b.y = cy + ny * BALL_RAD;
        let dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * BOUNCE;
        b.vy = (b.vy - 2 * dot * ny) * BOUNCE;
        if (power > 0) b.vy -= power;
    }
}

function startSlot() {
    slot.active = true;
    slot.spinning = [true, true, true];
    slot.timer = [1.0, 1.8, 2.5];
}

function checkSlot() {
    if (slot.val[0] === 7 && slot.val[1] === 7 && slot.val[2] === 7) {
        feverActive = true; feverTimer = 15;
        document.getElementById("fever-overlay").style.display = "block";
        score += 7777; shake = 25;
    }
    setTimeout(() => { slot.active = false; }, 1000);
}

function spawnMedal(x, y) {
    medals.push({x: x, y: y, vx: (Math.random()-0.5)*150, vy: -50});
}

function addScore(p) { score += p * (feverActive ? 3 : 1) * (1 + Math.floor(comboCount/10)); }

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("medals").innerText = medalCount;
    document.getElementById("balls").innerText = ballCount;
    document.getElementById("combo").innerText = "x" + (1 + Math.floor(comboCount/10));
}

function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
    ctx.clearRect(0,0,400,700);

    // 壁（ネオン）
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 3; ctx.shadowBlur = 12; ctx.shadowColor = '#0ff';
    ctx.beginPath();
    walls.forEach(w => { ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); });
    ctx.stroke();

    // デジタルスロット
    ctx.shadowBlur = 0; ctx.fillStyle = '#111'; ctx.fillRect(140, 40, 120, 50);
    ctx.strokeStyle = '#f0f'; ctx.strokeRect(140, 40, 120, 50);
    ctx.fillStyle = '#fff'; ctx.font = "20px 'Press Start 2P'";
    ctx.fillText(slot.val.join(' '), 150, 75);

    // バンパー
    bumpers.forEach(b => {
        ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    });

    // ホッパー
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0,255,255,0.3)';
    hoppers.forEach(h => { ctx.fillRect(h.x, h.y, h.w, h.h); ctx.strokeRect(h.x, h.y, h.w, h.h); });

    // フリッパー
    ctx.strokeStyle = '#ff0'; ctx.lineWidth = 10; ctx.shadowBlur = 8; ctx.shadowColor = '#ff0';
    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.px, f.py); ctx.rotate(f.angle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len * f.side, 0); ctx.stroke();
        ctx.restore();
    });

    // メダル
    ctx.fillStyle = '#ff0'; ctx.shadowBlur = 5; ctx.shadowColor = '#ff0';
    medals.forEach(m => { ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, Math.PI*2); ctx.fill(); });

    // ボールとプランジャー
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_RAD, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#444'; ctx.shadowBlur = 0;
    ctx.fillRect(355, 650 + ball.pull, 30, 60); // プランジャーのバネ

    ctx.restore();
}

function gameLoop(t) {
    if (gameState !== "PLAY") return;
    update((t - lastTime)/1000, t);
    draw();
    lastTime = t;
    requestAnimationFrame(gameLoop);
}

// --- 操作系 ---
window.addEventListener("touchstart", e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const tx = (touch.clientX - rect.left) * (400 / rect.width);
    if (tx > 340 && !ball.isMoving) ball.isPulling = true;
    else {
        if (tx < 200) flippers[0].active = true;
        else flippers[1].active = true;
    }
}, {passive:false});

window.addEventListener("touchend", e => {
    if (ball.isPulling) {
        ball.vy = -ball.pull * 8.5; ball.vx = -20;
        ball.isMoving = true; ball.isPulling = false;
    }
    flippers.forEach(f => f.active = false);
}, {passive:false});

function enterCode() {
    let c = prompt("ENTER CODE");
    if(c === "777") { score += 10000; feverActive = true; feverTimer = 20; }
}

function endGame() {
    gameState = "RESULT";
    document.getElementById("result-screen").style.display = "flex";
    document.getElementById("final-stats").innerText = "FINAL SCORE: " + score;
}
</script>
</body>
</html>

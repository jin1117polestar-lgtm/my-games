<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALAXY HYBRID - FIXED</title>
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: none; outline: none; }
        body { background-color: #000; margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; }
        #main-container { position: relative; width: 450px; height: 800px; background: #000; border: 4px solid #444; overflow: hidden; }
        .ui-layer { position: absolute; top: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #0ff; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; }
        .ui-box { border-right: 1px solid #222; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .ui-lbl { font-size: 9px; color: #0ff; }
        .ui-val { font-size: 16px; color: #fff; }
        #slot-area { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); width: 220px; height: 70px; background: #000; border: 3px solid #f0f; border-radius: 10px; display: flex; justify-content: space-around; align-items: center; z-index: 900; }
        .reel { font-size: 40px; color: #fff; font-weight: bold; width: 50px; text-align: center; }
        #fever-txt { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 70px; color: #ff0; font-weight: bold; display: none; z-index: 2000; text-shadow: 0 0 20px #f00; pointer-events: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; width: 450px; height: 800px; }
        #boot-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .btn { padding: 20px 40px; font-size: 24px; background: #0ff; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-container">
    <div class="ui-layer">
        <div class="ui-box"><span class="ui-lbl">SCORE</span><span id="s-score" class="ui-val">0</span></div>
        <div class="ui-box"><span class="ui-lbl">MEDAL</span><span id="s-medal" class="ui-val">0</span></div>
        <div class="ui-box"><span class="ui-lbl">BALL</span><span id="s-ball" class="ui-val">3</span></div>
        <div class="ui-box"><span class="ui-lbl">COMBO</span><span id="s-combo" class="ui-val">x1</span></div>
    </div>
    <div id="slot-area"><div id="re0" class="reel">7</div><div id="re1" class="reel">7</div><div id="re2" class="reel">7</div></div>
    <div id="fever-txt">FEVER!!</div>
    <canvas id="game-canvas"></canvas>
    <div id="boot-screen">
        <h1 style="color:#0ff;">GALAXY HYBRID</h1>
        <button class="btn" onclick="startGame()">START GAME</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = 450, H = 800;
canvas.width = W; canvas.height = H;

let score = 0, medal = 0, balls = 3, combo = 0, active = false, feverMode = 0;
let timeScale = 1.0;
const ball = { x: 420, y: 700, vx: 0, vy: 0, r: 10, inPlay: false, pull: 0, isPulling: false, history: [] };
let stars = [], walls = [], bumpers = [], flippers = [], particles = [], items = [], pins = [];
const slot = { active: false, res: [7,7,7], timers: [0,0,0] };
const activeTouches = new Map();

function initField() {
    stars = []; for(let i=0; i<50; i++) stars.push({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2});
    
    // フィールド形状の修正（右側の隙間を埋め、発射路を作成）
    walls = [
        {x1: 10, y1: 100, x2: 10, y2: 700, c: '#0ff'}, // 左壁
        {x1: 440, y1: 100, x2: 440, y2: 780, c: '#0ff'}, // 右外壁
        {x1: 400, y1: 180, x2: 400, y2: 780, c: '#0ff'}, // 発射路内壁
        {x1: 10, y1: 100, x2: 225, y2: 10, c: '#0ff'}, // 天井左
        {x1: 225, y1: 10, x2: 440, y2: 100, c: '#0ff'}, // 天井右
        {x1: 10, y1: 700, x2: 140, y2: 780, c: '#0ff'}, // 左下傾斜
        {x1: 400, y1: 700, x2: 310, y2: 780, c: '#0ff'}  // 右下傾斜
    ];

    // 釘の数を整理（通りやすく、かつ跳ねやすく）
    pins = [];
    for(let i=0; i<4; i++) {
        pins.push({x: 100 + i*80, y: 450, r: 5});
        pins.push({x: 60 + i*110, y: 550, r: 5});
    }

    // フリッパー位置の修正（重ならないように配置）
    flippers = [
        {side: 'L', x: 140, y: 780, len: 80, angle: 0.4, target: 0.4, base: 0.4},
        {side: 'R', x: 310, y: 780, len: 80, angle: -0.4, target: -0.4, base: -0.4}
    ];

    bumpers = [
        {x: 225, y: 300, r: 35, c: '#f0f', hit: 0, type: 'slot'},
        {x: 130, y: 220, r: 30, c: '#0ff', hit: 0, type: 'score'},
        {x: 320, y: 220, r: 30, c: '#0ff', hit: 0, type: 'score'}
    ];
}

function update(dt) {
    if (!active) return;
    dt *= timeScale;
    const steps = 8;
    const sdt = dt / steps;
    
    for(let s=0; s<steps; s++) {
        if (ball.inPlay) {
            ball.vy += 3500 * sdt; // 重力を大幅に強化
            ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;

            walls.forEach(w => resolveWall(ball, w));
            pins.forEach(p => {
                let dx = ball.x - p.x, dy = ball.y - p.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < ball.r + p.r) {
                    let nx = dx/dist, ny = dy/dist; ball.x = p.x + nx*(ball.r+p.r);
                    let dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx) * 0.6; ball.vy = (ball.vy - 2*dot*ny) * 0.6;
                }
            });
            flippers.forEach(f => {
                const dir = f.side === 'L' ? 1 : -1;
                const x2 = f.x + Math.cos(f.angle) * f.len * dir, y2 = f.y + Math.sin(f.angle) * f.len * dir;
                let kick = Math.abs(f.angle - f.target) > 0.1 ? 1800 : 0;
                resolveWall(ball, {x1: f.x, y1: f.y, x2: x2, y2: y2}, kick);
            });
            bumpers.forEach(b => {
                let dx = ball.x - b.x, dy = ball.y - b.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < ball.r + b.r) {
                    let nx = dx/dist, ny = dy/dist; ball.x = b.x + nx*(ball.r+b.r);
                    let dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx) * 1.5; ball.vy = (ball.vy - 2*dot*ny) * 1.5;
                    b.hit = 10; score += 100; combo++;
                    if (b.type === 'slot' && !slot.active) triggerSlot();
                }
            });
        }
    }

    if (ball.isPulling) ball.pull = Math.min(100, ball.pull + dt * 300);
    flippers.forEach(f => f.angle += (f.target - f.angle) * 30 * dt);
    
    // スロット演出中もゲームスピードを落としすぎない
    if (slot.active) {
        slot.timers.forEach((t, i) => {
            if (t > 0) {
                slot.timers[i] -= dt / timeScale;
                slot.res[i] = Math.floor(Math.random()*10);
                document.getElementById('re'+i).innerText = slot.res[i];
            }
        });
        if (slot.timers[2] <= 0 && slot.timers[2] > -1) {
            if (slot.res[0] === slot.res[1] && slot.res[1] === slot.res[2]) feverMode = 10;
            slot.active = false; timeScale = 1.0;
        }
    }

    if (ball.y > H + 50) { balls--; resetBall(); if(balls<=0) location.reload(); }
    updateUI();
}

function triggerSlot() { slot.active = true; timeScale = 0.3; slot.timers = [1, 1.5, 2]; }

function resolveWall(b, l, kick = 0) {
    let dx = l.x2 - l.x1, dy = l.y2 - l.y1, lenSq = dx*dx + dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x-l.x1)*dx + (b.y-l.y1)*dy) / lenSq));
    let cx = l.x1 + t*dx, cy = l.y1 + t*dy, dist = Math.sqrt((b.x-cx)**2 + (b.y-cy)**2);
    if (dist < b.r) {
        let nx = (b.x-cx)/dist, ny = (b.y-cy)/dist;
        b.x = cx + nx * (b.r + 1); b.y = cy + ny * (b.r + 1);
        let dot = b.vx*nx + ball.vy*ny;
        if (dot < 0) { b.vx = (b.vx - 2*dot*nx) * 0.7; b.vy = (b.vy - 2*dot*ny) * 0.7; }
        if (kick > 0) { b.vy = -kick; b.vx += (b.x - (l.x1+l.x2)/2) * 5; }
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,W,H);
    stars.forEach(s => { ctx.fillStyle='#333'; ctx.fillRect(s.x, s.y, s.s, s.s); });
    walls.forEach(w => { ctx.strokeStyle = w.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke(); });
    pins.forEach(p => { ctx.fillStyle = '#777'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); });
    bumpers.forEach(b => { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + b.hit, 0, Math.PI*2); ctx.fill(); if(b.hit>0) b.hit--; });
    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.angle);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len * (f.side==='L'?1:-1), 0); ctx.stroke();
        ctx.restore();
    });
    ctx.fillStyle = '#555'; ctx.fillRect(405, 700 + ball.pull, 30, 100);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
}

function resetBall() { ball.inPlay = false; ball.x = 420; ball.y = 700; ball.vx = 0; ball.vy = 0; ball.pull = 0; }
function updateUI() { document.getElementById('s-score').innerText = score; document.getElementById('s-ball').innerText = balls; }
function startGame() { document.getElementById('boot-screen').style.display='none'; active=true; initField(); resetBall(); animate(); }
function animate() { update(0.016); draw(); requestAnimationFrame(animate); }

window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for(let t of e.changedTouches) {
        const tx = (t.clientX - rect.left) * (W / rect.width);
        if (tx > 380 && !ball.inPlay) ball.isPulling = true;
        else if (tx < W/2) flippers[0].target = -0.6;
        else flippers[1].target = 0.6;
        activeTouches.set(t.identifier, tx);
    }
}, {passive:false});

window.addEventListener('touchend', (e) => {
    for(let t of e.changedTouches) {
        const tx = activeTouches.get(t.identifier);
        if (tx > 380 && ball.isPulling) { ball.vy = -1500 - ball.pull*20; ball.vx = -100; ball.inPlay = true; ball.isPulling = false; }
        else if (tx < W/2) flippers[0].target = flippers[0].base;
        else flippers[1].target = flippers[1].base;
        activeTouches.delete(t.identifier);
    }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE GALAXY PINBALL</title>
    <style>
        /* 基本設定：余計な挙動をすべて排除 */
        * { user-select: none; -webkit-user-select: none; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; margin: 0; overflow: hidden; font-family: 'Verdana', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #game-wrapper { position: relative; width: 450px; height: 800px; background: #000; border: 4px solid #333; overflow: hidden; }

        /* スタート画面を最前面に確実に表示 */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .big-play-btn {
            padding: 30px 80px; font-size: 32px; background: #0ff; border: none;
            border-radius: 100px; font-weight: bold; color: #000; cursor: pointer;
            box-shadow: 0 0 50px #0ff; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* UI情報：デジタルの豪華さ */
        .hud {
            position: absolute; top: 0; width: 100%; height: 90px;
            background: linear-gradient(180deg, #111, #000);
            border-bottom: 2px solid #0ff; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 100;
        }
        .hud-item { border-right: 1px solid #222; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hud-val { font-size: 22px; color: #fff; text-shadow: 0 0 10px #0ff; font-weight: bold; }

        /* スロット：ネオン管スタイル */
        #slot-area {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            width: 240px; height: 80px; background: #050505; border: 4px solid #f0f;
            border-radius: 15px; box-shadow: 0 0 30px #f0f; display: flex; justify-content: space-around; align-items: center; z-index: 90;
        }
        .digit { font-size: 48px; color: #fff; text-shadow: 0 0 10px #fff; }
        .digit.gold { color: #ff0; text-shadow: 0 0 20px #f00; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #fever-msg {
            position: absolute; top: 45%; width: 100%; text-align: center;
            font-size: 60px; color: #ff0; font-weight: bold; display: none;
            z-index: 500; text-shadow: 0 0 30px #f00; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div class="hud">
        <div class="hud-item"><span style="color:#0ff; font-size:10px;">SCORE</span><span id="score" class="hud-val">0</span></div>
        <div class="hud-item"><span style="color:#0ff; font-size:10px;">MEDAL</span><span id="medal" class="hud-val">0</span></div>
        <div class="hud-item"><span style="color:#0ff; font-size:10px;">BALL</span><span id="ball" class="hud-val">3</span></div>
        <div class="hud-item"><span style="color:#0ff; font-size:10px;">COMBO</span><span id="combo" class="hud-val">x1</span></div>
    </div>

    <div id="slot-area">
        <div id="r0" class="digit">7</div>
        <div id="r1" class="digit">7</div>
        <div id="r2" class="digit">7</div>
    </div>

    <div id="fever-msg">FEVER!!</div>

    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay">
        <h1 style="color:#0ff; text-shadow: 0 0 20px #0ff; font-size: 40px;">GALAXY PINBALL</h1>
        <p style="color:#666; margin-bottom: 30px;">TOUCH TO START</p>
        <button id="real-start-btn" class="big-play-btn">LAUNCH</button>
        <div onclick="adminMode()" style="margin-top:50px; color:#222; cursor:pointer;">SYSTEM_CODE</div>
    </div>
</div>

<script>
/**
 * 高精度物理 + 省略なし演出ピンボール
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 450, H = 800;
canvas.width = W; canvas.height = H;

// --- 状態管理 ---
let score = 0, medal = 0, balls = 3, combo = 0, feverTime = 0;
let gameStarted = false, adminWin = false;
let shake = 0;

const ball = {
    x: 418, y: 740, vx: 0, vy: 0, r: 10,
    active: false, pull: 0, isPulling: false, trail: []
};

let stars = [], particles = [], walls = [], bumpers = [], flippers = [], coins = [];
const slot = { active: false, res: [7,7,7], timers: [0,0,0] };

// --- 初期化 ---
function setupField() {
    stars = [];
    for(let i=0; i<80; i++) stars.push({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2, a: Math.random()});

    walls = [
        {x1: 10, y1: 150, x2: 10, y2: 720, c: '#0ff'}, // 左
        {x1: 10, y1: 720, x2: 150, y2: 790, c: '#0ff'}, // 左下
        {x1: 440, y1: 150, x2: 440, y2: 750, c: '#0ff'}, // 右外
        {x1: 395, y1: 200, x2: 395, y2: 750, c: '#0ff'}, // 発射壁
        {x1: 395, y1: 750, x2: 300, y2: 790, c: '#0ff'}, // 右下
        {x1: 10, y1: 150, x2: 120, y2: 20, c: '#0ff'},  // 天井カーブ
        {x1: 120, y1: 20, x2: 330, y2: 20, c: '#0ff'},
        {x1: 330, y1: 20, x2: 440, y2: 130, c: '#0ff'},
        {x1: 395, y1: 130, x2: 440, y2: 130, c: '#444'}  // ゲート
    ];

    flippers = [
        {side: 'L', x: 150, y: 790, len: 85, angle: 0.6, target: 0.6, base: 0.6},
        {side: 'R', x: 300, y: 790, len: 85, angle: -0.6, target: -0.6, base: -0.6}
    ];

    bumpers = [
        {x: 225, y: 260, r: 40, c: '#f0f', hit: 0, isSlot: true},
        {x: 120, y: 430, r: 30, c: '#0ff', hit: 0, isSlot: false},
        {x: 330, y: 430, r: 30, c: '#0ff', hit: 0, isSlot: false}
    ];
}

// --- 物理コア ---
function updatePhysics(dt) {
    if (!gameStarted) return;
    if (shake > 0) shake *= 0.9;

    const subSteps = 8; // すり抜けを絶対に許さない8分割計算
    const sdt = dt / subSteps;

    for (let s = 0; s < subSteps; s++) {
        if (ball.active) {
            ball.vy += 980 * sdt; // 重力
            ball.vx *= 0.9997; ball.vy *= 0.9997; 
            ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;

            // 壁との衝突（押し出し判定付き）
            walls.forEach(w => resolveWall(ball, w));

            // フリッパー（動的当たり判定）
            flippers.forEach(f => {
                const x2 = f.x + Math.cos(f.angle) * f.len * (f.side==='L'?1:-1);
                const y2 = f.y + Math.sin(f.angle) * f.len * (f.side==='L'?1:-1);
                const moving = Math.abs(f.angle - f.target) > 0.05;
                resolveWall(ball, {x1: f.x, y1: f.y, x2: x2, y2: y2}, moving ? 1100 : 0);
            });

            // バンパー
            bumpers.forEach(b => {
                let dx = ball.x - b.x, dy = ball.y - b.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < ball.r + b.r) {
                    let nx = dx/dist, ny = dy/dist;
                    ball.x = b.x + nx * (ball.r + b.r);
                    let dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx) * 1.8;
                    ball.vy = (ball.vy - 2*dot*ny) * 1.8;
                    b.hit = 15; shake = 6;
                    score += 500; combo++;
                    if (b.isSlot && !slot.active) startSlot();
                }
            });
        }
    }

    // スロット・演出更新
    if (feverTime > 0) {
        feverTime -= dt;
        if (Math.random() < 0.2) coins.push({x:Math.random()*W, y:-20, vy:250});
        if (feverTime <= 0) document.getElementById('fever-msg').style.display = 'none';
    }

    if (slot.active) {
        slot.timers.forEach((t, i) => {
            if (t > 0) {
                slot.timers[i] -= dt;
                slot.res[i] = Math.floor(Math.random()*10);
            } else if (adminWin) slot.res[i] = 7;
            const el = document.getElementById('r'+i);
            el.innerText = slot.res[i];
            el.className = slot.res[i] === 7 ? 'digit gold' : 'digit';
        });
        if (slot.timers[2] <= 0) {
            if (slot.res.every(v => v===7)) { feverTime = 15; document.getElementById('fever-msg').style.display='block'; }
            if (slot.timers[2] < -1.5) slot.active = false;
        }
    }

    if (ball.isPulling) ball.pull = Math.min(160, ball.pull + dt * 300);
    flippers.forEach(f => f.angle += (f.target - f.angle) * 35 * dt); // 戻り速度の向上

    coins.forEach((c, i) => {
        c.y += c.vy * dt;
        if (c.y > H) { coins.splice(i, 1); medal++; score += 100; }
    });

    if (ball.y > H + 50) {
        balls--;
        if (balls <= 0) { alert("GAME OVER\nSCORE: " + score); location.reload(); }
        else resetBall();
    }

    updateUI();
}

function resolveWall(b, l, kick = 0) {
    let dx = l.x2 - l.x1, dy = l.y2 - l.y1, lenSq = dx*dx + dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x-l.x1)*dx + (b.y-l.y1)*dy) / lenSq));
    let cx = l.x1 + t*dx, cy = l.y1 + t*dy;
    let dist = Math.sqrt((b.x-cx)**2 + (b.y-cy)**2);
    if (dist < b.r) {
        let nx = (b.x-cx)/dist, ny = (b.y-cy)/dist;
        b.x = cx + nx * (b.r + 0.5); b.y = cy + ny * (b.r + 0.5); // 押し出し
        let dot = b.vx*nx + b.vy*ny;
        if (dot < 0) {
            b.vx = (b.vx - 2*dot*nx) * 0.75;
            b.vy = (b.vy - 2*dot*ny) * 0.75;
        }
        if (kick > 0) { b.vy -= kick; b.vx += (b.x - l.x1) * 3; }
    }
}

// --- 描画 ---
function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(0, 0, W, H);
    
    // 背景
    stars.forEach(s => { ctx.globalAlpha = s.a; ctx.fillStyle='#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1.0;

    // 壁
    walls.forEach(w => {
        ctx.strokeStyle = w.c; ctx.lineWidth = 6; ctx.shadowBlur = 12; ctx.shadowColor = w.c;
        ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    });

    // バンパー
    bumpers.forEach(b => {
        ctx.shadowBlur = 20 + b.hit; ctx.shadowColor = b.c; ctx.fillStyle = b.c;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + (b.hit*0.3), 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        if (b.hit > 0) b.hit--;
    });

    // フリッパー
    ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.strokeStyle = '#ff0'; ctx.shadowBlur = 10;
    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.angle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len * (f.side==='L'?1:-1), 0); ctx.stroke();
        ctx.restore();
    });

    // ボール
    ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillStyle = '#eee';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

    // プランジャーバネ
    ctx.shadowBlur = 0; ctx.fillStyle = '#333'; ctx.fillRect(405, 750 + ball.pull, 25, 120);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    for(let i=0; i<12; i++) {
        let py = 750 + (ball.pull/12 * i) + (i*5);
        ctx.beginPath(); ctx.moveTo(405, py); ctx.lineTo(430, py); ctx.stroke();
    }

    // メダル
    ctx.shadowBlur = 10; ctx.shadowColor = '#ff0'; ctx.fillStyle = '#fd0';
    coins.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI*2); ctx.fill(); });

    ctx.restore();
}

// --- システム ---
function updateUI() {
    document.getElementById('score').innerText = Math.floor(score);
    document.getElementById('medal').innerText = medal;
    document.getElementById('ball').innerText = balls;
    document.getElementById('combo').innerText = 'x' + (1+Math.floor(combo/10));
}

function startSlot() { slot.active = true; slot.timers = [1.5, 2.5, 4.0]; }
function resetBall() { ball.active = false; ball.x = 418; ball.y = 740; ball.vx = 0; ball.vy = 0; ball.pull = 0; combo = 0; }

function launchGame() {
    document.getElementById('start-overlay').style.display = 'none';
    gameStarted = true;
    setupField();
    resetBall();
    function loop() { updatePhysics(0.016); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
}

// ボタンに直接リスナーを登録（スタート失敗の回避）
document.getElementById('real-start-btn').addEventListener('click', launchGame);
document.getElementById('real-start-btn').addEventListener('touchstart', (e) => { e.preventDefault(); launchGame(); });

// プレイ中の操作
const wrapper = document.getElementById('game-wrapper');
wrapper.addEventListener('touchstart', e => {
    if (!gameStarted) return;
    const rect = canvas.getBoundingClientRect();
    const touchX = (e.touches[0].clientX - rect.left) * (W / rect.width);
    if (touchX > 380 && !ball.active) ball.isPulling = true;
    else { if (touchX < W/2) flippers[0].target = -0.8; else flippers[1].target = 0.8; }
}, {passive:false});

wrapper.addEventListener('touchend', () => {
    if (ball.isPulling) {
        ball.vy = -(1280 + ball.pull * 9); ball.vx = -180;
        ball.active = true; ball.isPulling = false;
    }
    flippers.forEach(f => f.target = f.base);
});

function adminMode() { if(prompt("CODE?")==="7777"){ adminWin=true; startSlot(); } }
</script>
</body>
</html>

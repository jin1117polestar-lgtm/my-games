<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE GALAXY PINBALL - PRO</title>
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #main-container { position: relative; width: 450px; height: 800px; background: #000; border: 4px solid #333; overflow: hidden; box-shadow: 0 0 80px rgba(0,255,255,0.2); }
        
        /* デジタルUI */
        .ui-layer {
            position: absolute; top: 0; width: 100%; height: 90px;
            background: linear-gradient(180deg, #111, #000);
            border-bottom: 2px solid #0ff; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000;
        }
        .ui-box { border-right: 1px solid #222; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .ui-lbl { font-size: 10px; color: #0ff; font-weight: bold; }
        .ui-val { font-size: 20px; color: #fff; text-shadow: 0 0 10px #0ff; }

        /* スロット：ネオン管スタイル */
        #slot-display {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            width: 240px; height: 80px; background: #000; border: 3px solid #f0f;
            border-radius: 10px; box-shadow: 0 0 20px #f0f; display: flex; justify-content: space-around; align-items: center; z-index: 900;
        }
        .reel { font-size: 45px; color: #fff; font-weight: bold; transition: all 0.1s; }
        .reel.rolling { opacity: 0.5; transform: scale(0.9); filter: blur(2px); }
        .reel.win { color: #ff0; text-shadow: 0 0 15px #f00; }

        canvas { position: absolute; top: 0; left: 0; display: block; z-index: 10; }
        
        #boot-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .start-btn {
            padding: 30px 60px; font-size: 30px; background: #0ff; border: none;
            border-radius: 100px; font-weight: bold; color: #000; cursor: pointer;
            box-shadow: 0 0 40px #0ff; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #fever-txt {
            position: absolute; top: 40%; width: 100%; text-align: center;
            font-size: 60px; color: #ff0; font-weight: bold; display: none;
            z-index: 1500; text-shadow: 0 0 30px #f00; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="main-container">
    <div class="ui-layer">
        <div class="ui-box"><span class="ui-lbl">SCORE</span><span id="s-score" class="ui-val">0</span></div>
        <div class="ui-box"><span class="ui-lbl">MEDAL</span><span id="s-medal" class="ui-val">0</span></div>
        <div class="ui-box"><span class="ui-lbl">BALL</span><span id="s-ball" class="ui-val">3</span></div>
        <div class="ui-box"><span class="ui-lbl">COMBO</span><span id="s-combo" class="ui-val">x1</span></div>
    </div>

    <div id="slot-display">
        <div id="re0" class="reel">7</div>
        <div id="re1" class="reel">7</div>
        <div id="re2" class="reel">7</div>
    </div>

    <div id="fever-txt">FEVER!!</div>
    <canvas id="game-canvas"></canvas>

    <div id="boot-screen">
        <h1 style="color:#0ff; text-shadow:0 0 20px #0ff; margin-bottom:40px;">GALAXY PINBALL</h1>
        <button id="start-trigger" class="start-btn">PLAY START</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = 450, H = 800;
canvas.width = W; canvas.height = H;

let score = 0, medal = 0, balls = 3, combo = 0, feverTime = 0, active = false;
let adminWin = false, shake = 0;

const ball = {
    x: 418, y: 740, vx: 0, vy: 0, r: 10,
    inPlay: false, pull: 0, isPulling: false, history: []
};

let stars = [], walls = [], bumpers = [], flippers = [], particles = [], items = [], pins = [];
const slot = { active: false, res: [7,7,7], timers: [0,0,0] };

function initField() {
    stars = [];
    for(let i=0; i<100; i++) stars.push({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2, a: Math.random()});

    // 元の台形状をベースに、斜面を数ピクセル短縮し中央への「落とし」を強化
    walls = [
        {x1: 10, y1: 150, x2: 10, y2: 700, c: '#0ff'},
        {x1: 10, y1: 700, x2: 100, y2: 740, c: '#0ff'}, // 左下の傾斜：長さを微調整
        {x1: 440, y1: 150, x2: 440, y2: 750, c: '#0ff'},
        {x1: 395, y1: 220, x2: 395, y2: 750, c: '#0ff'},
        {x1: 395, y1: 750, x2: 350, y2: 740, c: '#0ff'}, // 右下の傾斜：バネへの道を確保しつつ短縮
        {x1: 10, y1: 150, x2: 120, y2: 20, c: '#0ff'},
        {x1: 120, y1: 20, x2: 330, y2: 20, c: '#0ff'},
        {x1: 330, y1: 20, x2: 440, y2: 130, c: '#0ff'},
        {x1: 395, y1: 180, x2: 440, y2: 130, c: '#444', isGate: true}
    ];

    flippers = [
        {side: 'L', x: 130, y: 760, len: 90, angle: 0.5, target: 0.5, base: 0.5},
        {side: 'R', x: 320, y: 760, len: 90, angle: -0.5, target: -0.5, base: -0.5}
    ];

    // パチンコ釘（ピン）の配置
    pins = [];
    const pinRows = 4;
    for(let i=0; i<pinRows; i++) {
        let cols = 5 + (i % 2);
        for(let j=0; j<cols; j++) {
            pins.push({ x: 80 + j*70 + (i%2? -35:0), y: 480 + i*45, r: 4 });
        }
    }

    bumpers = [
        {x: 225, y: 280, r: 40, c: '#f0f', hit: 0, type: 'slot'},
        {x: 100, y: 420, r: 35, c: '#0ff', hit: 0, type: 'score'},
        {x: 350, y: 420, r: 35, c: '#0ff', hit: 0, type: 'score'}
    ];
}

function update(dt) {
    if (!active) return;
    if (shake > 0) shake *= 0.9;

    const steps = 15; // 精度を上げつつ、重力・摩擦の比率で「重厚感」を出す
    const sdt = dt / steps;

    for(let s=0; s<steps; s++) {
        if (ball.inPlay) {
            ball.vy += 1500 * sdt; // 重力を少しだけマイルドに（1800→1500）して視認性アップ
            ball.vx *= 0.9997; ball.vy *= 0.9997;
            ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;

            walls.forEach(w => {
                if (w.isGate && ball.vy < 0) return;
                resolveWall(ball, w);
            });

            // 釘との衝突判定
            pins.forEach(p => {
                let dx = ball.x - p.x, dy = ball.y - p.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < ball.r + p.r) {
                    let nx = dx/dist, ny = dy/dist;
                    ball.x = p.x + nx * (ball.r + p.r);
                    let dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx) * 0.5; // 釘なので少し勢いを殺す
                    ball.vy = (ball.vy - 2*dot*ny) * 0.5;
                    score += 10;
                }
            });

            flippers.forEach(f => {
                const dir = f.side === 'L' ? 1 : -1;
                const x2 = f.x + Math.cos(f.angle) * f.len * dir;
                const y2 = f.y + Math.sin(f.angle) * f.len * dir;
                const moving = Math.abs(f.angle - f.target) > 0.1;
                resolveWall(ball, {x1: f.x, y1: f.y, x2: x2, y2: y2}, moving ? 1400 : 0);
            });

            bumpers.forEach(b => {
                let dx = ball.x - b.x, dy = ball.y - b.y, dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < ball.r + b.r) {
                    let nx = dx/dist, ny = dy/dist;
                    ball.x = b.x + nx * (ball.r + b.r);
                    let dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx) * 1.6;
                    ball.vy = (ball.vy - 2*dot*ny) * 1.6;
                    b.hit = 15; shake = 8;
                    score += 500; combo++;
                    if (b.type === 'slot' && !slot.active) startSlot();
                    createParticles(ball.x, ball.y, b.c);
                }
            });
        }
    }

    if (ball.isPulling) {
        ball.pull = Math.min(150, ball.pull + dt * 350); 
    }

    if (slot.active) {
        slot.timers.forEach((t, i) => {
            const el = document.getElementById('re'+i);
            if (t > 0) {
                slot.timers[i] -= dt;
                slot.res[i] = Math.floor(Math.random()*10);
                el.classList.add('rolling');
            } else {
                el.classList.remove('rolling');
                if (adminWin) slot.res[i] = 7;
            }
            el.innerText = slot.res[i];
            el.className = (slot.res[i] === 7 && t <= 0) ? 'reel win' : 'reel';
        });
        if (slot.timers[2] <= 0) {
            if (slot.res.every(v => v === 7)) { 
                if (feverTime <= 0) {
                    feverTime = 15; 
                    document.getElementById('fever-txt').style.display='block';
                    score += 10000;
                }
            }
            if (slot.timers[2] < -1.5) {
                slot.active = false;
                document.getElementById('fever-txt').style.display='none';
            }
        }
    }

    if (feverTime > 0) {
        feverTime -= dt;
        if (Math.random() < 0.1) items.push({x: Math.random()*W, y: -20, vy: 300});
    }

    flippers.forEach(f => f.angle += (f.target - f.angle) * 35 * dt);
    particles.forEach((p, i) => {
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    });
    items.forEach((it, i) => {
        it.y += it.vy * dt;
        if (it.y > H) { items.splice(i, 1); medal++; score += 100; }
    });

    if (ball.inPlay) {
        ball.history.push({x: ball.x, y: ball.y});
        if (ball.history.length > 10) ball.history.shift();
    }

    if (ball.y > H + 50) {
        balls--;
        if (balls <= 0) { alert("GAME OVER\nSCORE: " + score); location.reload(); }
        else resetBall();
    }
    updateUI();
}

function resolveWall(b, l, kick = 0) {
    let dx = l.x2 - l.x1, dy = l.y2 - l.y1, lenSq = dx*dx + dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x-l.x1)*dx + (b.y-l.y1)*dy) / lenSq));
    let cx = l.x1 + t*dx, cy = l.y1 + t*dy;
    let dist = Math.sqrt((b.x-cx)**2 + (b.y-cy)**2);
    if (dist < b.r) {
        let nx = (b.x-cx)/dist, ny = (b.y-cy)/dist;
        b.x = cx + nx * (b.r + 0.5); b.y = cy + ny * (b.r + 0.5);
        let dot = b.vx*nx + b.vy*ny;
        if (dot < 0) {
            b.vx = (b.vx - 2*dot*nx) * 0.7;
            b.vy = (b.vy - 2*dot*ny) * 0.7;
        }
        if (kick > 0) { b.vy -= kick; b.vx += (b.x - l.x1) * 2; }
    }
}

function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(0, 0, W, H);

    stars.forEach(s => { ctx.globalAlpha = s.a; ctx.fillStyle='#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1.0;

    // 釘の描画
    pins.forEach(p => {
        ctx.fillStyle = '#aaa'; ctx.shadowBlur = 5; ctx.shadowColor = '#fff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    });

    walls.forEach(w => {
        ctx.strokeStyle = w.c; ctx.lineWidth = 6; ctx.shadowBlur = 10; ctx.shadowColor = w.c;
        ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    });

    bumpers.forEach(b => {
        ctx.shadowBlur = 20 + b.hit; ctx.shadowColor = b.c; ctx.fillStyle = b.c;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + (b.hit*0.3), 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        if (b.type === 'slot') {
            ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
            ctx.fillText('SLOT', b.x, b.y + 5);
        }
        if (b.hit > 0) b.hit--;
    });

    ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = '#ff0'; ctx.shadowBlur = 10;
    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.angle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len * (f.side==='L'?1:-1), 0); ctx.stroke();
        ctx.restore();
    });

    ball.history.forEach((h, i) => {
        ctx.globalAlpha = i/10 * 0.3; ctx.fillStyle = '#0ff';
        ctx.beginPath(); ctx.arc(h.x, h.y, ball.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillStyle = '#eee';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#444'; ctx.fillRect(405, 750 + ball.pull, 30, 100);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
    let springStart = 750, springEnd = 750 + ball.pull;
    for(let i=0; i<=10; i++) {
        let y = springStart + (springEnd - springStart) * (i/10);
        ctx.beginPath(); ctx.moveTo(405, y); ctx.lineTo(435, y); ctx.stroke();
    }

    items.forEach(it => {
        ctx.shadowBlur = 10; ctx.shadowColor = '#ff0'; ctx.fillStyle='#fd0';
        ctx.beginPath(); ctx.arc(it.x, it.y, 8, 0, Math.PI*2); ctx.fill();
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
    });

    ctx.restore();
}

function startSlot() { slot.active = true; slot.timers = [1.2, 1.8, 2.5]; }
function createParticles(x, y, c) {
    for(let i=0; i<10; i++) particles.push({x:x, y:y, vx:(Math.random()-0.5)*400, vy:(Math.random()-0.5)*400, life:0.5, c:c});
}
function resetBall() { ball.inPlay = false; ball.x = 418; ball.y = 740; ball.vx = 0; ball.vy = 0; ball.pull = 0; ball.history = []; combo = 0; }
function updateUI() {
    document.getElementById('s-score').innerText = Math.floor(score);
    document.getElementById('s-medal').innerText = medal;
    document.getElementById('s-ball').innerText = balls;
    document.getElementById('s-combo').innerText = 'x' + (1+Math.floor(combo/10));
}

const bootBtn = document.getElementById('start-trigger');
function startGame() {
    document.getElementById('boot-screen').style.display = 'none';
    active = true; initField(); resetBall();
    const loop = () => { update(0.016); draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
}
bootBtn.addEventListener('click', startGame);
bootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });

window.addEventListener('touchstart', e => {
    if(!active) return;
    const touchX = e.touches[0].clientX - canvas.offsetLeft;
    if (touchX > 380 && !ball.inPlay) {
        ball.isPulling = true;
    } else {
        if (touchX < W/2) flippers[0].target = -0.8;
        else flippers[1].target = 0.8;
    }
}, {passive:false});

window.addEventListener('touchend', () => {
    if (ball.isPulling) {
        ball.vy = -(1400 + ball.pull * 10); ball.vx = -140;
        ball.inPlay = true; ball.isPulling = false;
    }
    flippers.forEach(f => f.target = f.base);
});
</script>
</body>
</html>

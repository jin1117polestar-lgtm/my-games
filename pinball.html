<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON PINBALL RUSH</title>
    <style>
        html, body {
            background: #000; color: #fff; text-align: center;
            font-family: sans-serif; /* 読み込みエラー回避のため標準フォントを優先 */
            overflow: hidden; touch-action: none; margin: 0; width: 100%; height: 100%;
        }
        #game-container {
            display: flex; flex-direction: column; height: 100vh;
            max-width: 500px; margin: 0 auto; position: relative;
            background: #0d011c;
        }
        .ui-top {
            height: 60px; display: grid; grid-template-columns: repeat(4, 1fr);
            align-items: center; background: rgba(20, 20, 20, 0.9);
            font-size: 10px; border-bottom: 2px solid #333; color: #0ff;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .start-btn {
            padding: 20px 40px; font-size: 20px; background: #0ff; border: none;
            border-radius: 40px; color: #000; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px #0ff; z-index: 110;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-top">
        <div>SCORE<br><span id="score">0</span></div>
        <div>MEDALS<br><span id="medals">0</span></div>
        <div>BALLS<br><span id="balls">3</span></div>
        <div>COMBO<br><span id="combo">x1</span></div>
    </div>
    
    <div style="position:relative; flex-grow:1; overflow:hidden;">
        <canvas id="gameCanvas" width="400" height="700"></canvas>
        
        <div id="start-screen" class="overlay">
            <h1 style="color:#0ff; margin-bottom:30px;">NEON PINBALL</h1>
            <button id="real-start-btn" class="start-btn">TAP TO START</button>
        </div>

        <div id="result-screen" class="overlay" style="display:none">
            <h2 style="color:#f0f;">GAME OVER</h2>
            <div id="final-stats"></div>
            <button onclick="location.reload()" class="start-btn" style="margin-top:20px;">RETRY</button>
        </div>
    </div>
</div>

<script>
// --- 基本設定 ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("start-screen");
const startBtn = document.getElementById("real-start-btn");

let gameState = "TITLE";
let score = 0, ballCount = 3, medalCount = 0, comboCount = 0;
let lastTime = 0, shake = 0, feverTimer = 0;

const GRAVITY = 350, BOUNCE = 0.7, FRICTION = 0.992, BALL_RAD = 9;
const ball = { x: 375, y: 630, vx: 0, vy: 0, isMoving: false, pull: 0, isPulling: false };

let walls = [], flippers = [], bumpers = [], hoppers = [], medals = [];
let slot = { val: [0, 0, 0], spinning: [false, false, false], timer: [0, 0, 0], active: false };

// --- 初期化 ---
function init() {
    walls = [
        {x1: 10, y1: 0, x2: 10, y2: 600}, // 左
        {x1: 10, y1: 600, x2: 140, y2: 680}, // 左下
        {x1: 390, y1: 0, x2: 390, y2: 650}, // 右外
        {x1: 350, y1: 120, x2: 350, y2: 650}, // 発射レーン内壁
        {x1: 350, y1: 650, x2: 260, y2: 680}, // 右下
        {x1: 10, y1: 0, x2: 340, y2: 0}, // 上
        {x1: 340, y1: 0, x2: 390, y2: 50} // 右上
    ];
    flippers = [
        {px: 140, py: 680, len: 65, angle: 0, side: -1, active: false},
        {px: 260, py: 680, len: 65, angle: 0, side: 1, active: false}
    ];
    bumpers = [
        {x: 200, y: 150, r: 25, score: 100, color: '#f0f'},
        {x: 100, y: 250, r: 20, score: 50, color: '#0f0'},
        {x: 300, y: 250, r: 20, score: 50, color: '#0f0'}
    ];
    hoppers = [{x: 180, y: 350, w: 40, h: 30, isSlot: true}];
}

// --- ゲーム開始命令を確実に実行 ---
startBtn.addEventListener("pointerdown", () => {
    if (gameState !== "TITLE") return;
    startScreen.style.display = "none";
    init();
    gameState = "PLAY";
    lastTime = performance.now();
    requestAnimationFrame(loop);
});

function loop(t) {
    if (gameState !== "PLAY") return;
    let dt = (t - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    draw();
    lastTime = t;
    requestAnimationFrame(loop);
}

function update(dt) {
    if (shake > 0) shake -= dt * 40;
    if (feverTimer > 0) feverTimer -= dt;

    // フリッパー
    flippers.forEach(f => {
        let target = f.active ? f.side * 0.7 : f.side * -0.2;
        f.angle += (target - f.angle) * 15 * dt;
    });

    if (ball.isPulling) ball.pull = Math.min(100, ball.pull + dt * 150);

    if (ball.isMoving) {
        ball.vy += GRAVITY * dt;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.vx *= FRICTION; ball.vy *= FRICTION;

        // 壁
        walls.forEach(w => collideLine(ball, w));
        // フリッパー
        flippers.forEach(f => {
            const x2 = f.px + Math.cos(f.angle) * f.len * f.side;
            const y2 = f.py + Math.sin(f.angle) * f.len * f.side;
            collideLine(ball, {x1: f.px, y1: f.py, x2: x2, y2: y2}, f.active ? 450 : 0);
        });
        // バンパー
        bumpers.forEach(b => {
            let dx = ball.x - b.x, dy = ball.y - b.y, d = Math.sqrt(dx*dx+dy*dy);
            if (d < BALL_RAD + b.r) {
                let nx = dx/d, ny = dy/d;
                ball.x = b.x + nx*(BALL_RAD+b.r);
                let dot = ball.vx*nx + ball.vy*ny;
                ball.vx = (ball.vx - 2*dot*nx)*1.5;
                ball.vy = (ball.vy - 2*dot*ny)*1.5;
                score += 100; shake = 10; comboCount++;
            }
        });

        if (ball.y > 720) {
            ballCount--;
            if (ballCount <= 0) { gameState = "RESULT"; document.getElementById("result-screen").style.display="flex"; }
            else { ball.x = 370; ball.y = 630; ball.vx = 0; ball.vy = 0; ball.isMoving = false; ball.pull = 0; }
        }
    }

    // メダル
    medals.forEach((m, i) => {
        m.vy += GRAVITY * dt; m.x += m.vx * dt; m.y += m.vy * dt;
        if (m.y > 690) { medals.splice(i,1); medalCount++; score += 150; }
    });

    document.getElementById("score").innerText = score;
    document.getElementById("medals").innerText = medalCount;
    document.getElementById("balls").innerText = ballCount;
    document.getElementById("combo").innerText = "x" + (1 + Math.floor(comboCount/10));
}

function collideLine(b, l, power=0) {
    let dx = l.x2 - l.x1, dy = l.y2 - l.y1, lenSq = dx*dx + dy*dy;
    let t = Math.max(0, Math.min(1, ((b.x - l.x1) * dx + (b.y - l.y1) * dy) / lenSq));
    let cx = l.x1 + t * dx, cy = l.y1 + t * dy;
    let dist = Math.sqrt((b.x - cx)**2 + (b.y - cy)**2);
    if (dist < BALL_RAD) {
        let nx = (b.x - cx)/dist, ny = (b.y - cy)/dist;
        b.x = cx + nx * BALL_RAD; b.y = cy + ny * BALL_RAD;
        let dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * BOUNCE;
        b.vy = (b.vy - 2 * dot * ny) * BOUNCE;
        if (power) b.vy -= power;
    }
}

function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2);
    ctx.clearRect(0,0,400,700);

    // 壁
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 3;
    ctx.beginPath();
    walls.forEach(w => { ctx.moveTo(w.x1,w.y1); ctx.lineTo(w.x2,w.y2); });
    ctx.stroke();

    // フリッパー
    ctx.strokeStyle = '#ff0'; ctx.lineWidth = 8;
    flippers.forEach(f => {
        ctx.save(); ctx.translate(f.px, f.py); ctx.rotate(f.angle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f.len * f.side, 0); ctx.stroke();
        ctx.restore();
    });

    // バンパー
    bumpers.forEach(b => {
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    });

    // ボール
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_RAD, 0, Math.PI*2); ctx.fill();
    
    // プランジャー
    ctx.fillStyle = '#444'; ctx.fillRect(360, 650 + ball.pull, 30, 50);

    ctx.restore();
}

// --- 操作 ---
window.addEventListener("pointerdown", e => {
    const rect = canvas.getBoundingClientRect();
    const tx = (e.clientX - rect.left) * (400 / rect.width);
    if (tx > 350 && !ball.isMoving) ball.isPulling = true;
    else {
        if (tx < 200) flippers[0].active = true;
        else flippers[1].active = true;
    }
});

window.addEventListener("pointerup", () => {
    if (ball.isPulling) {
        ball.vy = -ball.pull * 8; ball.vx = -15;
        ball.isMoving = true; ball.isPulling = false;
    }
    flippers.forEach(f => f.active = false);
});
</script>
</body>
</html>

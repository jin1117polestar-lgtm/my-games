<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPACE INVADERS - MOBILE</title>
    <style>
        html, body { background: #000; color: #fff; text-align: center; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; margin: 0; width: 100%; height: 100%; }
        #game-container { display: flex; flex-direction: column; height: 100vh; }
        .ui-top { height: 40px; display: flex; justify-content: space-around; align-items: center; background: #111; color: #0f0; font-size: 16px; flex-shrink: 0; border-bottom: 2px solid #333; }
        #screen-area { position: relative; flex-grow: 1; width: 100%; background: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; width: 100%; height: 100%; object-fit: contain; }
        
        /* 操作エリア */
        #touch-area { height: 20vh; width: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; border-top: 2px solid #333; flex-shrink: 0; }
        .instruction { color: #555; font-size: 12px; margin-top: 5px; }

        /* オーバーレイ表示 */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        button { padding: 15px 40px; font-size: 20px; background: #0f0; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .game-over-text { color: #f00; font-size: 40px; margin-bottom: 20px; }
        .stats { color: #aaa; margin: 15px 0; font-size: 18px; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-top">
        <div>SCORE: <span id="score">0</span></div>
        <div>WAVE: <span id="wave">1</span></div>
        <div>LIFE: <span id="life">3</span></div>
    </div>
    
    <div id="screen-area">
        <canvas id="gameCanvas" width="400" height="500"></canvas>

        <div id="start-screen" class="overlay">
            <h1 style="color:#0f0; font-size: 32px;">SPACE INVADERS</h1>
            <p style="color:#888;">SLIDE TO MOVE & SHOOT</p>
            <button onclick="startGame()">MISSION START</button>
        </div>

        <div id="result-screen" class="overlay" style="display:none">
            <h2 id="result-msg" class="game-over-text">GAME OVER</h2>
            <div class="stats">FINAL SCORE: <span id="final-score">0</span></div>
            <button onclick="location.reload()">RETRY</button>
        </div>
    </div>

    <div id="touch-area">
        <div style="width: 80%; height: 60px; border: 1px dashed #444; border-radius: 30px; display: flex; align-items: center; justify-content: center; color: #666;">
            ◀ SLIDE TO CONTROL ▶
        </div>
        <div class="instruction">AUTO-FIRE ENABLED</div>
    </div>
</div>

<script>
/** @type {HTMLCanvasElement} */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ゲーム設定
let gameState = "TITLE";
let score = 0, life = 3, wave = 1;
let lastTime = 0;

// プレイヤー設定
const player = {
    x: 180, y: 440, w: 30, h: 20, speed: 0,
    bullets: [],
    lastShot: 0,
    shotInterval: 400 // 連射速度(ms)
};

// 敵設定
let enemies = [];
let enemyBullets = [];
let enemyDirection = 1;
let enemyMoveTimer = 0;
let enemyMoveInterval = 1000; // 移動間隔（ミリ秒）
let enemyStepDown = false;

// 防壁設定
let bunkers = [];

function initGame() {
    score = 0; life = 3; wave = 1;
    player.x = canvas.width / 2 - 15;
    player.bullets = [];
    enemyBullets = [];
    spawnEnemies();
    createBunkers();
}

function spawnEnemies() {
    enemies = [];
    const rows = 5;
    const cols = 8;
    const padding = 35;
    const offsetX = 40;
    const offsetY = 50;
    
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            enemies.push({
                x: c * padding + offsetX,
                y: r * 30 + offsetY,
                w: 22, h: 18,
                type: r === 0 ? 'top' : (r < 3 ? 'mid' : 'bot'),
                points: (3 - Math.floor(r/2)) * 10
            });
        }
    }
    enemyMoveInterval = Math.max(100, 1000 - (wave * 100));
}

function createBunkers() {
    bunkers = [];
    for (let i = 0; i < 4; i++) {
        let bx = 50 + i * 90;
        let by = 380;
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 4; col++) {
                bunkers.push({ x: bx + col * 10, y: by + row * 10, w: 10, h: 10, hp: 3 });
            }
        }
    }
}

// タッチ操作
let lastTouchX = null;
window.addEventListener("touchstart", e => { lastTouchX = e.touches[0].clientX; });
window.addEventListener("touchmove", e => {
    if (gameState !== "PLAY") return;
    const touchX = e.touches[0].clientX;
    const deltaX = (touchX - lastTouchX) * 1.5;
    player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + deltaX));
    lastTouchX = touchX;
    if (e.cancelable) e.preventDefault();
}, {passive: false});

function startGame() {
    document.getElementById("start-screen").style.display = "none";
    gameState = "PLAY";
    initGame();
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
    if (gameState === "RESULT") return;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    if (gameState === "PLAY") {
        update(dt, timestamp);
        draw();
    }
    requestAnimationFrame(gameLoop);
}

function update(dt, now) {
    // プレイヤーの弾
    if (now - player.lastShot > player.shotInterval) {
        player.bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 10 });
        player.lastShot = now;
    }
    player.bullets.forEach((b, i) => {
        b.y -= 300 * dt;
        if (b.y < 0) player.bullets.splice(i, 1);
    });

    // 敵の移動ロジック
    enemyMoveTimer += dt * 1000;
    if (enemyMoveTimer > enemyMoveInterval) {
        let hitWall = false;
        enemies.forEach(e => {
            e.x += 15 * enemyDirection;
            if (e.x > canvas.width - 25 || e.x < 5) hitWall = true;
        });

        if (hitWall) {
            enemyDirection *= -1;
            enemies.forEach(e => { e.y += 20; });
        }
        enemyMoveTimer = 0;
        // 敵が下に到達
        if (enemies.some(e => e.y > player.y - 20)) endGame(false);
    }

    // 敵の弾
    if (Math.random() < 0.02 && enemies.length > 0) {
        const shooter = enemies[Math.floor(Math.random() * enemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.w/2, y: shooter.y + shooter.h, w: 3, h: 10 });
    }
    enemyBullets.forEach((eb, i) => {
        eb.y += 200 * dt;
        if (eb.y > canvas.height) enemyBullets.splice(i, 1);
        
        // プレイヤーへの当たり判定
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
            enemyBullets.splice(i, 1);
            life--;
            document.getElementById("life").innerText = life;
            if (life <= 0) endGame(false);
        }
    });

    // 当たり判定：自弾 vs 敵
    player.bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
            if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                player.bullets.splice(bi, 1);
                score += e.points;
                enemies.splice(ei, 1);
                document.getElementById("score").innerText = score;
                enemyMoveInterval *= 0.98; // 敵が減るほど速くなる
            }
        });
    });

    // 当たり判定：弾 vs バンカー
    [...player.bullets, ...enemyBullets].forEach((b, bi) => {
        bunkers.forEach((bun, bui) => {
            if (b.x > bun.x && b.x < bun.x + bun.w && b.y > bun.y && b.y < bun.y + bun.h) {
                bun.hp--;
                if (bun.hp <= 0) bunkers.splice(bui, 1);
                // 弾を消す（player.bulletsかenemyBulletsか判定して消す）
                if (player.bullets.includes(b)) player.bullets.splice(player.bullets.indexOf(b), 1);
                else enemyBullets.splice(enemyBullets.indexOf(b), 1);
            }
        });
    });

    if (enemies.length === 0) {
        wave++;
        document.getElementById("wave").innerText = wave;
        spawnEnemies();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // プレイヤー描画 (ドット絵風)
    ctx.fillStyle = "#0f0";
    ctx.fillRect(player.x, player.y + 5, player.w, player.h - 5);
    ctx.fillRect(player.x + player.w/2 - 4, player.y, 8, 5);

    // 敵描画
    enemies.forEach(e => {
        ctx.fillStyle = e.type === 'top' ? "#f0f" : (e.type === 'mid' ? "#0cf" : "#fff");
        ctx.fillRect(e.x, e.y, e.w, e.h);
        // 目
        ctx.fillStyle = "#000";
        ctx.fillRect(e.x + 4, e.y + 4, 3, 3);
        ctx.fillRect(e.x + e.w - 7, e.y + 4, 3, 3);
    });

    // バンカー描画
    bunkers.forEach(bun => {
        ctx.fillStyle = `rgba(0, 255, 0, ${bun.hp / 3})`;
        ctx.fillRect(bun.x, bun.y, bun.w, bun.h);
    });

    // 弾描画
    ctx.fillStyle = "#fff";
    player.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
    ctx.fillStyle = "#f33";
    enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));
}

function endGame(win) {
    gameState = "RESULT";
    document.getElementById("result-screen").style.display = "flex";
    document.getElementById("final-score").innerText = score;
    document.getElementById("result-msg").innerText = win ? "MISSION CLEAR!" : "GAME OVER";
}
</script>
</body>
</html>

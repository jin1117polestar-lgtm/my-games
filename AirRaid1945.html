<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKY RAIDERS: 1945 STYLE</title>
    <style>
        html, body { background: #000; color: #fff; text-align: center; font-family: 'Courier New', sans-serif; overflow: hidden; touch-action: none; margin: 0; width: 100%; height: 100%; -webkit-user-select: none; }
        #game-container { display: flex; flex-direction: column; height: 100vh; position: relative; }
        .ui-top { height: 74px; display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; background: rgba(10, 10, 20, 0.9); color: #0f0; font-size: 10px; border-bottom: 2px solid #0af; padding-top: env(safe-area-inset-top); z-index: 10; }
        #screen-area { position: relative; flex-grow: 1; width: 100%; background: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; width: 100%; height: 100%; object-fit: contain; }
        #touch-area { height: 110px; background: #050505; display: flex; align-items: center; justify-content: center; gap: 16px; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); position: relative; }

        #sp-gauge-container { position: absolute; bottom: 8px; left: 8%; width: 84%; height: 5px; background: #222; border-radius: 3px; overflow: hidden; }
        #sp-gauge-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0af, #fff); transition: width 0.1s; box-shadow: 0 0 8px #0af; }

        #wave-banner { position: absolute; top: 38%; left: 0; width: 100%; text-align: center; color: #0af; font-size: 24px; font-weight: bold; text-shadow: 0 0 15px #0af; opacity: 0; pointer-events: none; z-index: 20; letter-spacing: 4px; }
        #boss-alert { position: absolute; top: 44%; left: 0; width: 100%; text-align: center; color: #f33; font-size: 26px; font-weight: bold; text-shadow: 0 0 15px #f33; opacity: 0; pointer-events: none; z-index: 20; letter-spacing: 6px; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; overflow-y: auto; }
        button { padding: 14px 36px; font-size: 18px; background: #0af; color: #fff; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0 0 15px #0af; margin-top: 8px; }
        button.secondary { background: #333; box-shadow: none; font-size: 13px; padding: 9px 22px; }
        .stat-val { color: #fff; font-size: 15px; font-weight: bold; }
        #pause-btn { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,0.4); border: 1px solid #0af; color: #0af; font-size: 13px; padding: 6px 10px; border-radius: 4px; box-shadow: none; z-index: 15; }
        #buff-status { font-weight:bold; height:16px; color:#0af; font-size:12px; }

        .ship-picker { display: flex; gap: 18px; margin: 14px 0 20px; }
        .ship-card { border: 2px solid #333; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; width: 150px; cursor: pointer; }
        .ship-card.selected { border-color: #0af; box-shadow: 0 0 15px #0af; }
        .ship-card canvas { image-rendering: pixelated; margin-bottom: 6px; }
        .ship-card h3 { margin: 4px 0; font-size: 13px; color: #0af; }
        .stat-bar-row { display: flex; align-items: center; gap: 4px; font-size: 9px; color: #aaa; margin: 2px 0; text-align: left; }

<div id="game-container">

        </div>

        <canvas id="gameCanvas" width="400" height="500"></canvas>

        <div id="wave-banner"></div>
        <div id="boss-alert">WARNING</div>

        <button id="pause-btn" onclick="togglePause()">II</button>

            <p style="color:#fff; font-size:13px; margin-bottom: 4px;">1945 STYLE AIR COMBAT</p>

            <div class="ship-picker" id="ship-picker"></div>

            <button onclick="startGame()">SCRAMBLE!</button>
            <p style="color:#666; font-size:10px; margin-top:14px; line-height:1.6;">ドラッグで機体移動・自動射撃<br>アイテムで武器強化・ボムストック<br>ボムボタンで画面全体を薙ぎ払う</p>
        </div>

</div>

<script>

const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ============ ドット絵スプライト定義 ============
// half配列は「中心→翼端」方向の1文字コード列。mirrorRowで左右対称の1行分の文字列に変換する。
function mirrorRow(half) { return half.split('').reverse().join('') + half; }
function buildSprite(halfRows, palette) {
    return { rows: halfRows.map(mirrorRow), palette, w: halfRows[0].length * 2, h: halfRows.length };
}
function drawSprite(spr, x, y, scale, flashWhite) {
    for (let r = 0; r < spr.rows.length; r++) {
        const row = spr.rows[r];
        for (let c = 0; c < row.length; c++) {
            const ch = row[c];
            if (ch === '.') continue;
            ctx.fillStyle = flashWhite ? "#fff" : spr.palette[ch];
            ctx.fillRect(x + c*scale, y + r*scale, scale, scale);
        }
    }
}

const SHIPS = [

    }
];

// 自機イラストの縁取り(アウトライン)生成: 背景と同系色になっても視認できるよう、
// シルエットを複数方向にスタンプして輪郭を作る(shadowBlurのような滲みを避けるための技法)。
// Pythonで3ステージ分の背景色に合成して監査済みの配色・半径をそのまま移植している。
function buildOutlinedImage(img) {
    const pad = 4;
    const off = document.createElement("canvas");
    off.width = img.width + pad*2;
    off.height = img.height + pad*2;
    const octx = off.getContext("2d");

    function silhouette(color) {
        const c = document.createElement("canvas");
        c.width = img.width; c.height = img.height;
        const cctx = c.getContext("2d");
        cctx.drawImage(img, 0, 0);
        cctx.globalCompositeOperation = "source-in";
        cctx.fillStyle = color;
        cctx.fillRect(0, 0, img.width, img.height);
        return c;
    }
    function stamp(silCanvas, radius, steps) {
        for (let i = 0; i < steps; i++) {
            const a = (i/steps) * Math.PI*2;
            octx.drawImage(silCanvas, pad + Math.cos(a)*radius, pad + Math.sin(a)*radius);
        }
    }

    stamp(silhouette("rgba(6,14,24,0.6)"), 3.2, 16);   // 外側の暗いハロー(背景から確実に分離)
    stamp(silhouette("#a8ecff"), 1.4, 16);              // 内側の明るいリム(輪郭を締める)
    octx.drawImage(img, pad, pad);
    return off;
}

// 画像アセットの読み込み(未読み込み/失敗時は既存のドット絵buildSpriteに自動フォールバック)
SHIPS.forEach(ship => {
    ship.imgLoaded = false;
    if (!ship.imgSrc) return;
    const img = new Image();
    img.onload = () => {
        ship.imgLoaded = true;
        try { ship.outlineImg = buildOutlinedImage(img); } catch(e) { ship.outlineImg = null; }
        if (gameState === "TITLE") buildShipPicker();
    };
    img.onerror = () => { ship.imgLoaded = false; };
    img.src = ship.imgSrc;
    ship.img = img;
});

    ], { b:"#4a5568", h:"#8a9bb5", s:"#1c2430", g:"#0d1218", c:"#a8d8ff", w:"#6b7d99", u:"#c3d3e8", r:"#ff4444", p:"#222222" }),
    zigzag: buildSprite([

    ], { b:"#445577", h:"#8fa8cc", s:"#101825", g:"#0a0f18", c:"#8cd0ff", w:"#5a6b8a", u:"#b8c8e0", r:"#ff5555", p:"#222222" }),
    // ---- 以下、新規12種の地上/追加空中ユニット用フォールバック・プロシージャルスプライト ----

    turret: buildSprite([

    ], { b:"#555a55", h:"#8a908a", c:"#222222" }),
    battleship: buildSprite([

    ], { b:"#33403a", h:"#5a6a5a", g:"#1a2420", c:"#4a5a52", t:"#ffe14d", p:"#151b17" })
};

// 敵ユニット定義: 画像アセット(あれば)+フォールバック用プロシージャルスプライトキー+移動/攻撃パターン+ステージ割当を一元管理。
// kind: "air"(飛行/既存の縦スクロール型移動ベース) / "ground"(地上・海上の固定目標、横移動は最小限でスクロールに合わせて流れる)
// move: 実際の移動ロジックの識別子(update()内のswitchで使用)
// shoot: 既存fighter/bomber/zigzag(=aimed)の3パターンを流用する識別子
const ENEMY_DEFS = {

    bomber:       { imgSrc: "assets/enemies/unit1_bomber.png",       spriteKey: "bomber",     kind: "air",    move: "straight",        shoot: "bomber",  hp: 5, pts: 150 },
    zigzag:       { imgSrc: null,                                     spriteKey: "zigzag",     kind: "air",    move: "zigzag",           shoot: "aimed",   hp: 2, pts: 60 },
    jet:          { imgSrc: "assets/enemies/unit2_jet.png",          spriteKey: "jet",        kind: "air",    move: "jet",              shoot: "fighter", hp: 2, pts: 90 },

    heli_b:       { imgSrc: "assets/enemies/unit2_heli_b.png",       spriteKey: "heli",       kind: "air",    move: "heli",             shoot: "aimed",   hp: 3, pts: 100 },
    tank_a:       { imgSrc: "assets/enemies/unit1_tank_a.png",       spriteKey: "tank",       kind: "ground", move: "groundSlow",       shoot: "fighter", hp: 4, pts: 120 },

    turret_c:     { imgSrc: "assets/enemies/unit2_turret_c.png",     spriteKey: "turret",     kind: "ground", move: "turret",           shoot: "aimed",   hp: 3, pts: 80 },

    battleship_b: { imgSrc: "assets/enemies/unit1_battleship_b.png", spriteKey: "battleship", kind: "ground", move: "battleshipDrift", shoot: "bomber",  hp: 8, pts: 220 }

// ステージ毎に出現しうるユニットの排他的なリスト(このリストに無いユニットはそのステージでは一切出現しない)

    1: ["battleship_a", "battleship_b", "fighter", "bomber", "heli_a"],   // 海+島
    2: ["tank_a", "tank_b", "turret_a", "turret_b", "jet"],                // 砂漠+岩山+オアシス
    3: ["turret_c", "heli_b", "fighter", "bomber", "jet"]                  // 軍用基地(既出タイプの再構成+新規turret_c)
};

// 敵画像アセットの読み込み(自機・ボスと同じパターン: 失敗/未指定時は既存のドット絵spriteにフォールバック)
Object.keys(ENEMY_DEFS).forEach(key => {
    const def = ENEMY_DEFS[key];
    def.imgLoaded = false;
    if (!def.imgSrc) return;
    const img = new Image();
    img.onload = () => {
        def.imgLoaded = true;
        try { def.outlineImg = buildOutlinedImage(img); } catch(e) { def.outlineImg = null; }
    };
    img.onerror = () => { def.imgLoaded = false; };
    img.src = def.imgSrc;
    def.img = img;
});

const BOSS_TEMPLATE = [

// 3層当たり判定の定義(cx/cy: ボス中心からのオフセット比率, w/h: ボス描画サイズに対する比率)。

function ensureAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } }
function beep(freq, dur, type="square", vol=0.15, slideTo=null) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
}

function findNearestTarget(fromX, fromY) {
    let best = null, bestDist = Infinity;
    if (bossIsVulnerable()) {
        const d = Math.hypot(boss.x - fromX, boss.y - fromY);
        if (d < bestDist) { bestDist = d; best = boss; }
    }
    enemies.forEach(e => {
        const d = Math.hypot(e.x - fromX, e.y - fromY);
        if (d < bestDist) { bestDist = d; best = e; }
    });
    return best;
}

function createExplosion(x, y, color, count=8, size=null) {
    for(let i=0; i<count; i++) {
        particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1.0, color, size: Math.random()*3+1 });
    }
    // countを見た目サイズの手がかりに流用(既存呼び出し箇所を変更せずに済むように既定値化)。
    // 雑魚撃墜(count=10前後)は小さく、ボス撃破(count=50)は画面映えする大きさになるようスケールする。
    // 明示的にsizeが渡された場合はそちらを優先する。
    // count<8(1発ごとの被弾スパーク・マズルフラッシュ予告など、連射中に大量発生する軽量な呼び出し)は
    // スプライトアニメーションを重ねない。全弾着弾のたびに0.36秒の爆発アニメが乱発すると
    // 「撃破の爆発」の特別感が薄れ、連射時に画面がちらついて見えるため、撃破/被害級の爆発のみに限定する。
    if (count < 8 && size === null) return;
    const animSize = size !== null ? size : Math.min(170, 22 + count * 2.6);
    explosionAnims.push({ x, y, frame: 0, t: 0, size: animSize });
}

function buildShipPicker() {

        card.appendChild(desc);
        [["SPEED", ship.speed/2.6], ["POWER", ship.power/2], ["BOMB", ship.bombPower/2]].forEach(([label, ratio]) => {
            const row = document.createElement("div"); row.className = "stat-bar-row";
            row.innerHTML = `<span style="width:36px;">${label}</span><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.round(ratio*100)}%"></div></div>`;
            card.appendChild(row);
        });
        wrap.appendChild(card);
        const pctx = prevCanvas.getContext("2d");
        if (ship.imgLoaded) {
            pctx.imageSmoothingEnabled = true;
            const srcImg = ship.outlineImg || ship.img;
            const iw = srcImg.width, ih = srcImg.height;
            const scale = Math.min((84-10)/iw, (84-10)/ih);
            const ox = (84 - iw*scale)/2, oy = (84 - ih*scale)/2;
            pctx.drawImage(srcImg, ox, oy, iw*scale, ih*scale);
        } else {
            pctx.imageSmoothingEnabled = false;
            const s = ship.sprite;
            const scale = Math.min((84-10)/s.w, (84-10)/s.h);
            const ox = (84 - s.w*scale)/2, oy = (84 - s.h*scale)/2;
            for (let r=0;r<s.rows.length;r++) for (let c=0;c<s.rows[r].length;c++) {
                const ch = s.rows[r][c]; if (ch==='.') continue;
                pctx.fillStyle = s.palette[ch];
                pctx.fillRect(ox+c*scale, oy+r*scale, scale, scale);
            }
        }
    });
}

let cloudShadows = [];
function initGroundDecor(stage) {
    groundDecor = [];
    cloudShadows = [];
    const count = stage === 3 ? 7 : 9;
    for (let i=0;i<count;i++) {
        groundDecor.push({
            x: Math.random()*canvas.width, y: Math.random()*canvas.height*2 - canvas.height,
            size: 14+Math.random()*20, seed: Math.random(), rot: Math.random()*Math.PI*2, kind: Math.floor(Math.random()*3)
        });
    }
    for (let i=0;i<5;i++) {
        cloudShadows.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height*2 - canvas.height, rx: 30+Math.random()*40, ry: 14+Math.random()*10 });
    }
}

function drawCloudShadows(dt, alpha) {
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    cloudShadows.forEach(c => {
        c.y += dt * (30 + stageNum*4);
        if (c.y > canvas.height + 40) c.y -= canvas.height + 80;
        ctx.beginPath(); ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI*2); ctx.fill();
    });
}

function drawBackground(dt) {
    scrollY += dt * (60 + stageNum*10);
    const sy = scrollY % 40;
    const spd = 60 + stageNum*10;
    if (stageNum === 1) {
        // 海: 深浅グラデーション + 波紋 + 泡 + 雲影 + 艦影
        const grad = ctx.createLinearGradient(0,0,0,canvas.height);
        grad.addColorStop(0,"#0d4a80"); grad.addColorStop(1,"#082a52");
        ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
        drawCloudShadows(dt, 0.10);
        for (let y = -40; y < canvas.height+40; y += 40) {
            ctx.strokeStyle = "rgba(180,220,255,0.22)"; ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 8) {
                const yy = y + sy + Math.sin((x*0.05) + scrollY*0.02)*4;
                if (x===0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
            }
            ctx.stroke();
            // 波頭の泡
            for (let x = 4; x <= canvas.width; x += 24) {
                const yy = y + sy + Math.sin((x*0.05) + scrollY*0.02)*4;
                if (Math.sin(x*0.7+y)>0.6) { ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.fillRect(x, yy-1, 3, 2); }
            }
        }
        groundDecor.forEach(d => {
            d.y += dt * spd;
            if (d.y > canvas.height + 40) d.y -= canvas.height + 80;
            // 航跡(引き波)
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            ctx.beginPath(); ctx.moveTo(d.x, d.y - d.size*1.6);
            ctx.lineTo(d.x - d.size*0.5, d.y - d.size*3.2); ctx.lineTo(d.x + d.size*0.5, d.y - d.size*3.2);
            ctx.closePath(); ctx.fill();
            // 艦体
            ctx.fillStyle = "#33403a";
            ctx.fillRect(d.x-d.size*0.5, d.y-d.size*0.22, d.size, d.size*0.44);
            ctx.fillStyle = "#4a5a52";
            ctx.fillRect(d.x-d.size*0.15, d.y-d.size*0.55, d.size*0.3, d.size*0.35);
            ctx.fillStyle = "#1a2420";
            ctx.fillRect(d.x-d.size*0.05, d.y-d.size*0.75, d.size*0.1, d.size*0.22);
        });
    } else if (stageNum === 2) {
        // 島(密林): 地形パッチ + 樹冠クラスタ + 川
        // 色相をオリーブ寄りから青緑寄りにずらし、緑迷彩の自機との衝突を避ける(縁取りに加えた補完的な調整)
        ctx.fillStyle = "#1c4a3a"; ctx.fillRect(0,0,canvas.width,canvas.height);
        drawCloudShadows(dt, 0.14);
        ctx.strokeStyle = "rgba(120,170,220,0.35)"; ctx.lineWidth = 10;
        ctx.beginPath();
        for (let y=-40;y<canvas.height+40;y+=20) {
            const x = canvas.width*0.5 + Math.sin(y*0.02 + scrollY*0.01)*90;
            if (y===-40) ctx.moveTo(x, y+sy); else ctx.lineTo(x, y+sy);
        }
        ctx.stroke();
        groundDecor.forEach(d => {
            d.y += dt * spd;
            if (d.y > canvas.height + 40) d.y -= canvas.height + 80;
            const base = d.seed>0.5 ? "#3a6a2a" : "#2f5a22";
            const dark = d.seed>0.5 ? "#25451a" : "#1e3a16";
            ctx.fillStyle = base;
            ctx.beginPath(); ctx.arc(d.x, d.y, d.size*0.55, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = dark;
            ctx.beginPath(); ctx.arc(d.x-d.size*0.15, d.y-d.size*0.1, d.size*0.22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(d.x+d.size*0.18, d.y+d.size*0.14, d.size*0.18, 0, Math.PI*2); ctx.fill();
            if (d.kind === 2) { ctx.fillStyle = "#6a5a3a"; ctx.fillRect(d.x-d.size*0.35, d.y+d.size*0.4, d.size*0.7, d.size*0.22); }
        });
    } else {
        // 要塞基地: タイル床 + リベット + 砲台 + レーダー + 警戒ライン
        ctx.fillStyle = "#26262c"; ctx.fillRect(0,0,canvas.width,canvas.height);
        drawCloudShadows(dt, 0.16);
        ctx.strokeStyle = "rgba(255,80,80,0.12)"; ctx.lineWidth = 1;
        for (let y=-40;y<canvas.height+40;y+=40) { ctx.beginPath(); ctx.moveTo(0, y+sy); ctx.lineTo(canvas.width, y+sy); ctx.stroke(); }
        for (let x=0;x<canvas.width;x+=50) { ctx.strokeStyle = "rgba(200,200,220,0.08)"; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
        for (let y=-40;y<canvas.height+40;y+=40) for (let x=0;x<canvas.width;x+=50) {
            ctx.fillStyle = "rgba(150,150,160,0.25)"; ctx.fillRect(x+2, (y+sy)+2, 2, 2); ctx.fillRect(x+46, (y+sy)+2, 2, 2);
        }
        groundDecor.forEach(d => {
            d.y += dt * spd; d.rot += dt * 0.6;
            if (d.y > canvas.height + 40) d.y -= canvas.height + 80;
            ctx.fillStyle = "#3a3a42";
            ctx.beginPath(); ctx.arc(d.x, d.y, d.size*0.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#26262e";
            ctx.beginPath(); ctx.arc(d.x, d.y, d.size*0.28, 0, Math.PI*2); ctx.fill();
            if (d.kind === 0) {
                // 対空砲(旋回する砲身)
                ctx.strokeStyle = "#555"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x + Math.cos(d.rot)*d.size*0.7, d.y + Math.sin(d.rot)*d.size*0.7); ctx.stroke();
                ctx.fillStyle = "#f33"; ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI*2); ctx.fill();
            } else if (d.kind === 1) {
                // レーダー皿
                ctx.strokeStyle = "#7a8"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.size*0.4, Math.PI, Math.PI*2); ctx.stroke();
            } else {
                ctx.fillStyle = "#f33"; ctx.fillRect(d.x-d.size*0.15, d.y-d.size*0.15, d.size*0.3, d.size*0.3);
            }
        });
    }
}

const STAGE_LENGTH = 32; // 撃破必要体数(ボス出現までの目安)
function initStage() {
    enemies = []; enemyBullets = []; items = []; boss = null;
    document.getElementById("boss-hp-container").style.display = "none";

    stageTimer = 0; spawnTimer = 1; stageEnemiesLeft = STAGE_LENGTH + stageNum*6;
    initGroundDecor(stageNum);
    showBanner("wave-banner", "STAGE " + stageNum + (isHardMode() ? " HARD" : ""));

// ステージ開始直後は緩やかに、経過時間とともに現在の密度まで上がっていく難易度カーブ
// Hardループ中は再スタート時から既にある程度の密度がある状態にする(床上げ)
function difficultyFactor() { return Math.max(isHardMode() ? 0.5 : 0, Math.min(1, stageTimer / 16)); }

function spawnEnemyWave() {
    const df = difficultyFactor();
    const patterns = ["line", "vshape", "zigzagLine"];
    const pat = patterns[Math.floor(Math.random()*patterns.length)];
    // ステージごとの排他的な出現プール(STAGE_ENEMY_POOL)からのみ選択する。ここに無いタイプはそのステージに出現しない。
    const typePool = STAGE_ENEMY_POOL[stageNum] || STAGE_ENEMY_POOL[1];
    if (pat === "line") {
        const n = Math.max(3, Math.round(5 - (1-df)*2));
        for (let i=0;i<n;i++) {
            const type = typePool[Math.floor(Math.random()*typePool.length)];
            enemies.push(makeEnemy(type, 40 + i*65, -30 - i*20));
        }
    } else if (pat === "vshape") {
        const n = Math.max(3, Math.round(5 - (1-df)*2));
        for (let i=0;i<n;i++) {
            const type = typePool[Math.floor(Math.random()*typePool.length)];
            const dx = Math.abs(i-2);
            enemies.push(makeEnemy(type, 200 + (i-2)*40, -30 - dx*25));
        }
    } else {
        const n = Math.max(4, Math.round(6 - (1-df)*2));
        for (let i=0;i<n;i++) {
            const type = typePool[Math.floor(Math.random()*typePool.length)];
            enemies.push(makeEnemy(type, 30 + i*60, -30, i%2===0 ? 1 : -1));
        }
    }
}

function makeEnemy(type, x, y, zigDir=1) {
    const def = ENEMY_DEFS[type];
    const spr = ENEMY_SPRITES[def.spriteKey];
    const hp = def.hp, pts = def.pts;
    const scrollSpd = 60 + stageNum*10; // 背景スクロール速度(drawBackgroundのspdと同一)。地上/海上ユニットはこの速度で「流れる」。
    const e = {
        type, x, y, baseX: x, w: spr.w*2.2, h: spr.h*2.2, hp, maxHp: hp, pts,
        t: 0, zigDir, shootT: Math.random()*1.5, kind: def.kind, move: def.move, shoot: def.shoot
    };
    if (def.kind === "air") {
        if (def.move === "jet") e.vy = (60 + stageNum*8) * 1.7;       // ジェット: 速く・攻撃的に
        else if (def.move === "heli") e.vy = (60 + stageNum*8) * 0.45; // ヘリ: ゆっくり降下しつつ左右にホバー&ストレイフ
        else e.vy = 60 + stageNum*8;
    } else {
        // 地上/海上ユニット: 独自にマニューバせず、地形と同じ速度でスクロールして流れていく
        e.vy = scrollSpd;
        if (def.move === "battleshipDrift") e.dir = Math.random() < 0.5 ? -1 : 1;
    }
    return e;
}

// region(cx/cy/w/h比率)をボスのローカル座標(中心原点)の矩形に変換する共通処理。
// 当たり判定(ワールド座標)と、破壊済みパーツの描画(ボス中心基準のローカル座標)の両方から使う。
function regionLocalRect(region, w, h) {
    return {
        x: region.cx * w - (region.w * w) / 2,
        y: region.cy * h - (region.h * h) / 2,
        w: region.w * w,
        h: region.h * h
    };
}
function getBossRegionRect(b, region) {
    const r = regionLocalRect(region, b.w, b.h);
    return { x: b.x + r.x, y: b.y + r.y, w: r.w, h: r.h };
}
// ボスが登場演出中でなく、実際に干渉可能(被弾・接触が成立する)状態かどうかの一元判定。
// 自機弾・自機接触・ボムなど、ボスに影響を与えうる経路は必ずこれを通すこと。
function bossIsVulnerable() { return !!(boss && boss.state === "battle"); }

function spawnBoss() {
    const def = BOSSES[stageNum-1];
    bossPhase = 1;
    const maxHp = Math.floor((140 + stageNum*60) * def.hpMul);
    let w, h;
    if (def.imgLoaded) {
        h = canvas.height * def.heightRatio;
        w = h * (def.img.naturalWidth / def.img.naturalHeight);
    } else {
        w = def.sprite.w * def.scale * 2.6;
        h = def.sprite.h * def.scale * 2.6;
    }
    const weapons = def.hitboxDef.weapons.map(wd => ({ ...wd, hp: wd.maxHp, destroyed: false }));
    boss = {
        def, w, h, hp: maxHp, maxHp, dir: 1, timer: 0, attackTimer: 0,
        state: "entering", rotation: 0, weapons, hitboxDef: def.hitboxDef,
        telegraphs: [], // ボス固有の弾幕テレグラフ(予告演出)キュー。updateBoss内で経過管理・発火する。
        x: 200, y: -h
    };
    // ボスごとの登場演出の初期状態
    if (def.entranceType === "riseFlip") {
        boss.x = 200;
        boss.y = canvas.height + boss.h;      // 画面下からスタート
        boss.enterPhase = "ascend";
    } else if (def.entranceType === "driveIn") {
        boss.driveSide = Math.random() < 0.5 ? -1 : 1;  // -1:画面左から, 1:画面右から
        boss.x = boss.driveSide < 0 ? -boss.w : canvas.width + boss.w;
        boss.y = 110;
        boss.targetX = 200;
    } else { // fadeIn (クイーンバチ): 通常の敵同様に上から進入
        boss.x = 200;
        boss.y = -boss.h;
        boss.targetY = 130;
    }
    document.getElementById("boss-hp-container").style.display = "block";
    showBanner("boss-alert", "WARNING");
}

function showBanner(id, text) {
    const el = document.getElementById(id);
    el.innerText = text;
    el.style.transition = "none"; el.style.opacity = "0";
    requestAnimationFrame(() => {
        el.style.transition = "opacity 0.3s";
        el.style.opacity = "1";
        setTimeout(() => { el.style.opacity = "0"; }, 1300);
    });
}

// ============ 操作 ============
let lastTouchX = null;
let lastTouchY = null;
window.addEventListener("touchstart", e => { ensureAudio(); if (e.target.closest("#bomb-btn,#pause-btn,button")) return; lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; }, {passive: false});
window.addEventListener("touchmove", e => {
    if (gameState !== "PLAY" || lastTouchX === null) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const dx = (e.touches[0].clientX - lastTouchX) * scale * player.ship.speed;
    const dy = (e.touches[0].clientY - lastTouchY) * scale * player.ship.speed;
    player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + dx));
    player.y = Math.max(0, Math.min(canvas.height - player.h, player.y + dy));
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    e.preventDefault();
}, {passive: false});
let mouseDown = false;
canvas.addEventListener("mousedown", e => { ensureAudio(); mouseDown = true; lastTouchX = e.clientX; lastTouchY = e.clientY; });
window.addEventListener("mouseup", () => mouseDown = false);
window.addEventListener("mousemove", e => {
    if (gameState !== "PLAY" || !mouseDown) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const dx = (e.clientX - lastTouchX) * scale * player.ship.speed;
    const dy = (e.clientY - lastTouchY) * scale * player.ship.speed;
    player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + dx));
    player.y = Math.max(0, Math.min(canvas.height - player.h, player.y + dy));
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
});

function togglePause() {
    if (gameState === "PLAY") {
        gameState = "PAUSE";
        document.getElementById("pause-screen").style.display = "flex";
    } else if (gameState === "PAUSE") {
        gameState = "PLAY";
        document.getElementById("pause-screen").style.display = "none";
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }
}
window.addEventListener("keydown", e => { if (e.code === "KeyP" || e.code === "Escape") togglePause(); });

function useBomb() {
    if (gameState !== "PLAY" || bombStock <= 0) return;
    bombStock--;
    updateBombUI();
    sfx.bomb();
    shake = 35; bombFlashT = 0.4;
    enemyBullets = [];
    const dmg = 6 * player.ship.bombPower;
    for (let i=enemies.length-1;i>=0;i--) {
        enemies[i].hp -= dmg;
        if (enemies[i].hp <= 0) { killEnemy(enemies[i], i); }
    }
    if (bossIsVulnerable()) {
        boss.hp -= dmg * 2;
        checkBossPhase();
        if (boss.hp <= 0) defeatBoss();
    }
}
function updateBombUI() {
    document.getElementById("bomb-count").innerText = bombStock;
    document.getElementById("bomb-btn").disabled = bombStock <= 0;
}

function loadHighScore() {
    highScore = parseInt(localStorage.getItem("skyRaiders1945HighScore") || "0", 10);
    document.getElementById("highscore").innerText = highScore;
    document.getElementById("start-highscore").innerText = highScore;
}
loadHighScore();

function startGame() {
    ensureAudio();
    document.getElementById("start-screen").style.display = "none";
    gameState = "PLAY";
    score = 0; life = 3; stageNum = 1; loopNum = 1; spGauge = 0; comboCount = 0; bombStock = 3;
    player.ship = SHIPS[selectedShipIdx];
    player.weaponLv = 1; player.x = 180; player.y = 420; player.invuln = 0; player.bullets = []; player.lastSubShot = 0;
    document.getElementById("life").innerText = life;
    document.getElementById("score").innerText = score;
    document.getElementById("weaponlv").innerText = "Lv1";

    initStage();

function spawnItem(x, y) {
    if (Math.random() > 0.16) return;
    const types = ["power", "bomb", "life", "score"];
    const weights = [0.42, 0.22, 0.08, 0.28];
    let r = Math.random(), acc = 0, chosen = types[0];
    for (let i = 0; i < types.length; i++) { acc += weights[i]; if (r <= acc) { chosen = types[i]; break; } }
    items.push({ x, y, w: 14, h: 14, type: chosen, vy: 90 });
}

function fireWeapon(now) {
    const interval = player.ship.shotInterval;
    if (now - player.lastShot <= interval) return;
    player.lastShot = now;
    sfx.shot();
    const cx = player.x + player.w/2 - 2;
    const lv = player.weaponLv;
    const bp = player.ship.power * (lv >= 5 ? 1.5 : 1);
    if (lv >= 4) {
        // Lv4-5: 5WAY(Lv5は威力強化)
        for (let i=-2; i<=2; i++) player.bullets.push({ x: cx, y: player.y, w: 4, h: 15, vx: i*2.4, dmg: bp, color: lv>=5?"#fff":"#0af" });
    } else if (lv === 3) {
        for (let i=-2; i<=2; i+=2) player.bullets.push({ x: cx, y: player.y, w: 4, h: 15, vx: i*2.2, dmg: bp, color: "#0af" });
        player.bullets.push({ x: cx, y: player.y, w: 4, h: 15, vx: 0, dmg: bp, color: "#fff" });
    } else if (lv === 2) {
        player.bullets.push({ x: cx-6, y: player.y, w: 4, h: 12, vx: 0, dmg: bp, color: "#fff" });
        player.bullets.push({ x: cx+6, y: player.y, w: 4, h: 12, vx: 0, dmg: bp, color: "#fff" });
    } else {
        player.bullets.push({ x: cx, y: player.y, w: 4, h: 12, vx: 0, dmg: bp, color: "#fff" });
    }
}

// 機体固有のサブ武装(武装Lvと連動して自動強化。Strikers 1945のサーチバルカン/オートレーザー相当)
function fireSubWeapon(now) {
    const lv = player.weaponLv;
    if (lv < 2 || !player.ship.subWeapon) return;
    const interval = Math.max(220, 620 - lv*80);
    if (now - player.lastSubShot <= interval) return;
    player.lastSubShot = now;
    const cx = player.x + player.w/2 - 2;
    const bp = player.ship.power;
    if (player.ship.subWeapon === "search") {
        const count = lv >= 4 ? 2 : 1;
        for (let i=0; i<count; i++) {
            const side = i===0 ? -1 : 1;
            player.bullets.push({ x: cx + side*8, y: player.y+6, w: 3, h: 8, vx: side*40, dmg: bp*0.5, color: "#7fffd4", homing: true, turnRate: 3.2 });
        }
    } else if (player.ship.subWeapon === "laser") {
        const count = lv >= 4 ? 2 : 1;
        for (let i=0; i<count; i++) {
            const side = count===1 ? 0 : (i===0?-1:1);
            player.bullets.push({ x: cx + side*9, y: player.y, w: 3, h: 24, vx: 0, dmg: bp*0.7, color: "#ff66ff", pierce: true, hitsLeft: 4 });
        }
    }
}

function damagePlayer(now) {
    if (player.invuln > 0) return;
    life--; shake = 30; player.invuln = 1.6; comboCount = 0;
    player.weaponLv = Math.max(1, player.weaponLv - 1);
    document.getElementById("weaponlv").innerText = "Lv" + player.weaponLv;
    sfx.hurt();
    document.getElementById("life").innerText = life;
    if (life <= 0) endGame(false);
}

function killEnemy(e, idx) {
    createExplosion(e.x+e.w/2, e.y+e.h/2, "#ffa040", 10);
    enemies.splice(idx, 1);
    comboCount++; comboTimer = 0;
    let pts = Math.floor(e.pts * (1 + comboCount * 0.08));
    addScore(pts);
    spawnItem(e.x+e.w/2, e.y+e.h/2);
    spGauge = Math.min(100, spGauge + 2);
    stageEnemiesLeft = Math.max(0, stageEnemiesLeft - 1);
}

function checkBossPhase() {
    const ratio = boss.hp / boss.maxHp;
    const newPhase = ratio > 0.6 ? 1 : (ratio > 0.3 ? 2 : 3);
    if (newPhase !== bossPhase) { bossPhase = newPhase; shake = 15; }
}

function defeatBoss() {
    createExplosion(boss.x + boss.w/2, boss.y + boss.h/2, "#ff8040", 50);
    addScore(3000 + stageNum*500); comboCount = 0; shake = 45;
    sfx.explode();
    boss = null;
    document.getElementById("boss-hp-container").style.display = "none";
    if (stageNum >= 3) {
        if (loopNum < 2) {
            // Normal(1周目)クリア→シームレスにHard(2周目)へ継続。確認画面なし、スコア/ライフ/武装Lv/ボム所持数は一切リセットしない。
            setTimeout(()=>{ sfx.stageClear(); loopNum = 2; stageNum = 1; initStage(); }, 400);
            gameState = "STAGE_CLEAR_WAIT";
            setTimeout(()=>{ if (gameState === "STAGE_CLEAR_WAIT") gameState = "PLAY"; }, 450);
        } else {
            setTimeout(()=>endGame(true), 300);
        }
    } else {
        setTimeout(()=>{ sfx.stageClear(); stageNum++; initStage(); }, 400);
        gameState = "STAGE_CLEAR_WAIT";
        setTimeout(()=>{ if (gameState === "STAGE_CLEAR_WAIT") gameState = "PLAY"; }, 450);
    }
}

function update(dt, now) {
    if (shake > 0) shake -= dt * 40;
    if (bombFlashT > 0) bombFlashT -= dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (gameState !== "PLAY") return;

    document.getElementById("sp-gauge-fill").style.width = spGauge + "%";
    const buffs = [];
    if (player.weaponLv >= 2) buffs.push("WEAPON Lv" + player.weaponLv);
    if (player.weaponLv >= 2 && player.ship.subWeapon) {
        buffs.push(player.ship.subWeapon === "search" ? "SEARCH VULCAN" : "AUTO LASER");
    }
    document.getElementById("buff-status").innerText = buffs.join(" / ");

    if (comboCount > 0) {
        comboTimer += dt;
        if (comboTimer > 3) { comboCount = Math.max(0, comboCount - 1); comboTimer = 0; }
    }

    fireWeapon(now);
    fireSubWeapon(now);

    // 自機弾の移動と当たり判定
    for (let i = player.bullets.length - 1; i >= 0; i--) {
        let b = player.bullets[i];
        if (b.homing) {
            if (b.vy === undefined) b.vy = -player.ship.bulletSpeed*0.55;
            const target = findNearestTarget(b.x, b.y);
            if (target) {
                const dx = target.x - b.x, dy = target.y - b.y;
                const len = Math.max(1, Math.hypot(dx, dy));
                const spd = player.ship.bulletSpeed*0.55;
                const turn = Math.min(1, b.turnRate * dt);
                b.vx += (dx/len*spd - b.vx) * turn;
                b.vy += (dy/len*spd - b.vy) * turn;
            }
            b.x += b.vx * dt; b.y += b.vy * dt;
        } else {
            b.y -= player.ship.bulletSpeed * dt;
            b.x += (b.vx || 0) * dt;
        }
        if (b.y < -20 || b.y > canvas.height+20 || b.x < -20 || b.x > canvas.width+20) { player.bullets.splice(i, 1); continue; }

        if (bossIsVulnerable()) {
            // 3層当たり判定: まず武装(weapons)を個別HPで判定、当たらなければcore(本体)を判定。
            // どちらの領域にも入らない場合は装飾部分としてノーコリジョン(弾はそのまま素通り)。
            let hitPart = false;
            for (const wpn of boss.weapons) {
                if (wpn.destroyed) continue;
                const r = getBossRegionRect(boss, wpn);
                if (b.x < r.x+r.w && b.x+b.w > r.x && b.y < r.y+r.h && b.y+b.h > r.y) {
                    if (!b.pierce || --b.hitsLeft <= 0) player.bullets.splice(i, 1);
                    wpn.hp -= b.dmg;
                    sfx.bossHit();
                    createExplosion(b.x, b.y, "#f80", 3);
                    if (wpn.hp <= 0) destroyWeapon(boss, wpn);
                    hitPart = true;
                    break;
                }
            }
            if (!hitPart) {
                const core = getBossRegionRect(boss, boss.hitboxDef.core);
                if (b.x < core.x+core.w && b.x+b.w > core.x && b.y < core.y+core.h && b.y+b.h > core.y) {
                    if (!b.pierce || --b.hitsLeft <= 0) player.bullets.splice(i, 1);
                    boss.hp -= b.dmg;
                    sfx.bossHit();
                    createExplosion(b.x, b.y, "#f00", 3);
                    checkBossPhase();
                    document.getElementById("boss-hp-bar").style.width = Math.max(0,(boss.hp/boss.maxHp)*100) + "%";
                    if (boss.hp <= 0) defeatBoss();
                    hitPart = true;
                }
            }
            if (hitPart) continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (b.x > e.x-e.w/2 && b.x < e.x+e.w/2 && b.y > e.y-e.h/2 && b.y < e.y+e.h/2) {
                e.hp -= b.dmg;
                if (!b.pierce || --b.hitsLeft <= 0) player.bullets.splice(i, 1);
                createExplosion(b.x, b.y, "#0af", 3);
                if (e.hp <= 0) {
                    killEnemy(e, j);
                    if (spGauge >= 100 && player.weaponLv < 3) { }
                } else sfx.bossHit();
                break;
            }
        }
    }

    // アイテム
    for (let i = items.length-1; i>=0; i--) {
        const it = items[i];
        it.y += it.vy * dt;
        if (it.y > canvas.height) { items.splice(i,1); continue; }
        if (it.x < player.x+player.w && it.x+it.w > player.x && it.y < player.y+player.h && it.y+it.h > player.y) {
            applyItem(it.type);
            items.splice(i,1);
        }
    }

    // 敵スポーン & ボス出現判定
    if (!boss) {
        stageTimer += dt;
        spawnTimer -= dt;
        if (spawnTimer <= 0 && stageEnemiesLeft > 0) {
            spawnEnemyWave();
            spawnTimer = Math.max(0.5, (1.6 - stageNum*0.08) + (1-difficultyFactor())*1.1);
        }
        if (stageEnemiesLeft <= 0 && enemies.length === 0) {
            spawnBoss();
        }
    } else {
        updateBoss(dt, now);
    }

    // 敵の移動・攻撃
    for (let i = enemies.length-1; i>=0; i--) {
        const e = enemies[i];
        e.t += dt;
        e.y += e.vy * dt;
        // 移動パターン(move): 飛行タイプは既存の直進/ジグザグ路線を踏襲・拡張、地上/海上タイプは
        // 自律的にマニューバせず、地形と同じ速度で流れるだけ(旋回砲塔は微小な揺れのみ)。
        if (e.move === "zigzag") {
            e.x += Math.sin(e.t*4) * 90 * dt * e.zigDir;
        } else if (e.move === "jet") {
            // ジェット: ほぼ直進だが速度感を出すための小さな蛇行
            e.x += Math.sin(e.t*2.4) * 40 * dt * e.zigDir;
        } else if (e.move === "heli") {
            // ヘリ: ゆっくり降下しながら左右に大きくホバー&ストレイフ
            e.x = e.baseX + Math.sin(e.t*1.6) * 70;
        } else if (e.move === "turret") {
            // 砲台: 据え置き兵器なので、わずかな旋回揺れ程度でほぼ静止
            e.x = e.baseX + Math.sin(e.t*0.8) * 4;
        } else if (e.move === "groundSlow") {
            // 戦車: 地上車両として最小限の左右のブレのみ
            e.x = e.baseX + Math.sin(e.t*0.5) * 2;
        } else if (e.move === "battleshipDrift") {
            // 戦艦: ボスの横ドリフトに準じた、ゆったり広い横移動
            e.x += BOSS_DRIFT_SPEED * 0.5 * e.dir * dt;
            if (e.x > canvas.width - e.w*0.3 || e.x < e.w*0.3) e.dir *= -1;
        }
        if (e.move !== "heli" && e.move !== "turret" && e.move !== "groundSlow") {
            e.x = Math.max(15, Math.min(canvas.width-15, e.x));
        }
        e.shootT -= dt;
        if (e.shootT <= 0 && e.y > 0 && e.y < 380) {
            const cooldownBonus = (1-difficultyFactor())*0.9; // ステージ開始直後は射撃間隔を延ばして緩やかに
            // 射撃パターン(shoot): 既存のfighter(直進)/bomber(左右2方向)/aimed(=旧zigzagの弱め狙い撃ち)の
            // 3パターンを、シルエット・役割に応じて各ユニットに割り当てて流用する。
            if (e.shoot === "fighter") {
                e.shootT = 1.6 + Math.random()*1.0 - stageNum*0.08 + cooldownBonus;
                enemyBullets.push({ x: e.x, y: e.y, w: 4, h: 8, vx: 0, vy: 150 });
            } else if (e.shoot === "bomber") {
                e.shootT = 1.8 + Math.random()*0.6 - stageNum*0.05 + cooldownBonus;
                enemyBullets.push({ x: e.x, y: e.y, w: 4, h: 8, vx: -70, vy: 140 });
                enemyBullets.push({ x: e.x, y: e.y, w: 4, h: 8, vx: 70, vy: 140 });
            } else {
                // aimed: 弱めの狙い撃ち(速度を抑えて回避しやすく)
                e.shootT = 1.7 + Math.random()*1.2 - stageNum*0.08 + cooldownBonus;
                const dx = (player.x+player.w/2) - e.x, dy = (player.y - e.y);
                const len = Math.max(1, Math.hypot(dx,dy));
                enemyBullets.push({ x: e.x, y: e.y, w: 4, h: 8, vx: dx/len*100, vy: dy/len*100 + 70 });
            }
            // Hardループ限定の追加弾: 通常弾に加えて射撃パターンごとに1パターン上乗せ(既存パターンは変更しない)
            if (isHardMode()) {
                if (e.shoot === "fighter") {
                    // 直進弾のみだったfighter系(fighter/jet/tank)に、Hardでは狙い撃ちの副弾を追加
                    const dx = (player.x+player.w/2) - e.x, dy = (player.y - e.y);
                    const len = Math.max(1, Math.hypot(dx,dy));
                    enemyBullets.push({ x: e.x, y: e.y, w: 4, h: 8, vx: dx/len*120, vy: dy/len*120 + 60 });
                } else if (e.shoot === "bomber") {
                    // 左右2方向だけだったbomber系(bomber/battleship)に、Hardでは中央直進弾を追加して3方向に
                    enemyBullets.push({ x: e.x, y: e.y, w: 4, h: 8, vx: 0, vy: 160 });
                }
            }
        }
        if (e.y > canvas.height + 40) enemies.splice(i, 1);
    }

    // 敵弾
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        if (eb.homing) {
            // 自機弾のホーミング実装(turnRate/速度ブレンド)と同じ考え方を敵弾にも適用。
            // turnRateを緩めに設定することで、必ず避けられる程度の追尾に留める。
            const dx = player.x - eb.x, dy = player.y - eb.y;
            const len = Math.max(1, Math.hypot(dx, dy));
            const spd = Math.hypot(eb.vx||0, eb.vy||140) || 140;
            const turn = Math.min(1, (eb.turnRate||1.5) * dt);
            const desiredVx = dx/len*spd, desiredVy = dy/len*spd;
            eb.vx = (eb.vx||0) + (desiredVx - (eb.vx||0)) * turn;
            eb.vy = (eb.vy||140) + (desiredVy - (eb.vy||140)) * turn;
        }
        eb.x += (eb.vx||0) * dt;
        eb.y += (eb.vy||220) * dt;
        if (eb.y > canvas.height || eb.y < -20 || eb.x < -20 || eb.x > canvas.width+20) { enemyBullets.splice(i, 1); continue; }
        if (eb.x < player.x+player.w && eb.x+eb.w > player.x && eb.y < player.y+player.h && eb.y+eb.h > player.y) {
            enemyBullets.splice(i, 1);
            damagePlayer(now);
        }
    }

    // 敵機体と自機の衝突
    for (let i = enemies.length-1; i>=0; i--) {
        const e = enemies[i];
        if (e.x-e.w/2 < player.x+player.w && e.x+e.w/2 > player.x && e.y-e.h/2 < player.y+player.h && e.y+e.h/2 > player.y) {
            createExplosion(e.x, e.y, "#ffa040", 12);
            enemies.splice(i,1);
            damagePlayer(now);
        }
    }

    // ボスとの接触判定(3層当たり判定): coreに触れたら即死級ダメージ、weaponsはグレイズのみで死なない
    if (bossIsVulnerable()) {
        const core = getBossRegionRect(boss, boss.hitboxDef.core);
        if (player.x < core.x+core.w && player.x+player.w > core.x && player.y < core.y+core.h && player.y+player.h > core.y) {
            damagePlayer(now);
        }
    }

    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= dt * 2;
        if(p.life <= 0) particles.splice(i, 1);
    }

    // 爆発スプライトアニメーションの再生位置を進める(4フレーム再生し終えたら配列から除去)
    for (let i = explosionAnims.length - 1; i >= 0; i--) {
        const ea = explosionAnims[i];
        ea.t += dt;
        if (ea.t >= EXPLOSION_FRAME_DURATION) {
            ea.t -= EXPLOSION_FRAME_DURATION;
            ea.frame++;
            if (ea.frame >= EXPLOSION_FRAMES.length) { explosionAnims.splice(i, 1); }
        }
    }

    document.getElementById("score").innerText = score;
}

function applyItem(type) {
    sfx.item();
    if (type === "power") { player.weaponLv = Math.min(5, player.weaponLv + 1); document.getElementById("weaponlv").innerText = "Lv"+player.weaponLv; addScore(50); }
    else if (type === "bomb") {
        if (bombStock >= 9) { addScore(10000); } // 実機準拠: ストック上限超過は得点ボーナスに変換
        else { bombStock++; updateBombUI(); addScore(50); }
    }
    else if (type === "life") { life = Math.min(9, life+1); document.getElementById("life").innerText = life; }
    else if (type === "score") { addScore(300 * (1+Math.floor(comboCount/5))); }
}

const BOSS_DRIFT_SPEED = 35;   // 海竜/白虎の通常戦闘時のゆったりした横ドリフト速度(調整用定数)
const QUEEN_DASH_SPEED = 230;  // 女王バチの急発進速度(調整用定数)
const BOSS_ENTER_SPEED = 160;  // 登場演出の移動速度(調整用定数)

function destroyWeapon(boss, wpn) {
    wpn.destroyed = true;
    const r = getBossRegionRect(boss, wpn);
    createExplosion(r.x + r.w/2, r.y + r.h/2, "#ffcf6b", 18);
    sfx.explode();
    // パーツ破壊と弾幕パターンの連携(follow-up実装): 各ボスのbossAttackXXX関数がboss.weaponsの
    // destroyedフラグを直接参照しているため、ここで別途処理する必要はない。
    // 海竜改: turretL/turretR破壊でその砲塔からの射撃が止まる(両方破壊で本体中心にフォールバック)
    // 陸戦重爆: gunArm破壊で機関砲連射が止まる(重榴弾・バラージは本体由来のため継続)
    // 要塞戦闘機: head破壊でホーミング弾(索敵システム)が止まる、stinger破壊で狙い撃ち尾針弾が止まる
}

// ============ ボス固有攻撃パターン(アーキタイプ別) ============
// 各関数はbossPhase(1/2/3)を「間隔/弾数の強度倍率」として扱い、パターンの形状自体はボスごとに固定する。
// 破壊されたweaponsサブパーツはここで直接チェックし、そのパーツ由来の攻撃だけを止める。

// 海竜改(battleship archetype, stage1): 「面制圧」型。中央1点ではなく、船体各所(turretL/turretR)から
// 独立して発射することで画面全体を読ませる。発射直前に短いマズルフラッシュの予告を入れて理不尽さを軽減する。
function bossAttackSeaDragon(bx, by) {
    const activeTurrets = boss.weapons.filter(w => (w.id === "turretL" || w.id === "turretR") && !w.destroyed);
    const origins = activeTurrets.map(w => {
        const r = getBossRegionRect(boss, w);
        return { x: r.x + r.w/2, y: r.y + r.h*0.5 };
    });
    if (origins.length === 0) origins.push({ x: bx, y: by }); // 両砲塔破壊時は本体中心からのフォールバック

    const fireFrom = (o, vx, vy) => {
        createExplosion(o.x, o.y, "#fff", 3); // 即時のマズルフラッシュ的パーティクル
        boss.telegraphs.push({
            t: 0.15, total: 0.15, kind: "muzzle", x: o.x, y: o.y,
            onFire: () => enemyBullets.push({ x: o.x, y: o.y, w: 6, h: 14, vx, vy })
        });
    };
    origins.forEach(o => fireFrom(o, 0, 190));
    if (bossPhase >= 2) origins.forEach(o => fireFrom(o, (Math.random()-0.5)*70, 205)); // phase2: 各砲塔から追加の斜め弾
    if (bossPhase >= 3) fireFrom({ x: bx, y: by }, (player.x-bx)*0.4, 220); // phase3: さらに本体中心から自機狙いを追加
}

// 陸戦重爆(tank archetype, stage2): 「重戦車の緩急」型。避けやすいが重い榴弾+gunArmからの速い機関砲連射
// (gunArm破壊で連射だけ停止)に加え、予告付きの着弾地点バラージ(緊張と解放)を織り交ぜる。
function bossAttackWhiteTiger(bx, by) {
    const cy = by - boss.h*0.1;
    // 1) 重榴弾: 大きく・遅く、読みやすいが直撃は痛い
    enemyBullets.push({ x: bx, y: cy, w: 14, h: 14, vx: (player.x-bx)*0.15, vy: 105, color: "#ffae42" });

    // 2) gunArmからの速い機関砲連射(gunArm破壊で停止)
    const gunArm = boss.weapons.find(w => w.id === "gunArm");
    if (gunArm && !gunArm.destroyed) {
        const r = getBossRegionRect(boss, gunArm);
        const ox = r.x + r.w/2, oy = r.y + r.h/2;
        const shots = bossPhase >= 3 ? 4 : (bossPhase === 2 ? 3 : 2);
        for (let k = 0; k < shots; k++) {
            enemyBullets.push({ x: ox, y: oy, w: 4, h: 10, vx: (k - (shots-1)/2) * 18, vy: 320, color: "#f33" });
        }
    }

    // 3) テレグラフ付き着弾バラージ(緊張と解放の砲撃): phase2以上で発生確率あり
    if (bossPhase >= 2 && Math.random() < 0.5) {
        const tx = Math.max(30, Math.min(canvas.width-30, player.x + (Math.random()-0.5)*60));
        const ty = Math.min(canvas.height - 60, 260 + Math.random()*80);
        boss.telegraphs.push({
            t: 0.7, total: 0.7, kind: "barrage", x: tx, y: ty,
            onFire: () => {
                createExplosion(tx, ty, "#ff8040", 14);
                for (let a=-2; a<=2; a++) enemyBullets.push({ x: tx, y: ty, w: 6, h: 6, vx: a*32, vy: 60, color: "#f33" });
            }
        });
    }
}

// 要塞戦闘機(flying-robot archetype, stage3): 両翼からの「挟撃(ピンサー)」型に加え、headが健在な間だけ
// 緩やかなホーミング弾(索敵)、stingerが健在な間だけ尾針の狙い撃ちを追加する。ダッシュ中は呼ばれない(呼び出し元で保証)。
function bossAttackQueenBee(bx, by) {
    const wingL = { x: bx - boss.w*0.34, y: by - boss.h*0.05 };
    const wingR = { x: bx + boss.w*0.34, y: by - boss.h*0.05 };
    [[wingL,-1], [wingR,1]].forEach(([o, side]) => {
        boss.telegraphs.push({
            t: 0.12, total: 0.12, kind: "muzzle", x: o.x, y: o.y,
            onFire: () => enemyBullets.push({ x: o.x, y: o.y, w: 5, h: 10, vx: side*(bossPhase>=3?90:60), vy: 180 })
        });
    });

    const head = boss.weapons.find(w => w.id === "head");
    if (head && !head.destroyed && bossPhase >= 2) {
        const r = getBossRegionRect(boss, head);
        enemyBullets.push({ x: r.x+r.w/2, y: r.y+r.h/2, w: 6, h: 6, vx: 0, vy: 130, homing: true, turnRate: 1.6, color: "#faa" });
    }
    const stinger = boss.weapons.find(w => w.id === "stinger");
    if (stinger && !stinger.destroyed && bossPhase >= 3) {
        const r = getBossRegionRect(boss, stinger);
        enemyBullets.push({ x: r.x+r.w/2, y: r.y+r.h/2, w: 6, h: 14, vx: (player.x-bx)*0.3, vy: 230, color: "#fff" });
    }
}

// 登場演出(entering)専用の更新。ボスタイプごとの決め打ちの動き。この間は当たり判定なし。
function updateBossEntrance(dt) {
    if (boss.def.entranceType === "riseFlip") {
        // 画面下から上昇 → 画面上端を突き抜けて完全に消える → 180度回転して現れる → 今度は下降して定位置へ
        if (boss.enterPhase === "ascend") {
            boss.y -= BOSS_ENTER_SPEED * dt;
            if (boss.y < -boss.h) {
                boss.enterPhase = "descend";
                boss.rotation = Math.PI; // ミラーではなく180度回転(非対称なドラゴン頭部の向きを正しく戻すため)
            }
        } else {
            boss.y += BOSS_ENTER_SPEED * dt;
            if (boss.y >= 90) {
                boss.y = 90;
                boss.rotation = 0;
                boss.state = "battle";
            }
        }
    } else if (boss.def.entranceType === "driveIn") {
        // 画面端(左右どちらか)からドリフトしながら侵入し、砂煙を曳く
        const dir = boss.driveSide < 0 ? 1 : -1;
        boss.x += dir * BOSS_ENTER_SPEED * dt;
        if (Math.random() < 0.6) {
            particles.push({
                x: boss.x - dir*boss.w*0.42 + (Math.random()-0.5)*16,
                y: boss.y + boss.h*0.34 + (Math.random()-0.5)*10,
                vx: -dir*2 - Math.random()*2, vy: (Math.random()-0.5)*1.4,
                life: 0.9, color: Math.random() < 0.5 ? "#b89968" : "#8a6a3f", size: Math.random()*3+2
            });
        }
        if ((dir > 0 && boss.x >= boss.targetX) || (dir < 0 && boss.x <= boss.targetX)) {
            boss.x = boss.targetX;
            boss.state = "battle";
        }
    } else { // fadeIn (クイーンバチ): 通常の敵と同様に上から進入するだけ
        boss.y += BOSS_ENTER_SPEED * 0.6 * dt;
        if (boss.y >= boss.targetY) {
            boss.y = boss.targetY;
            boss.state = "battle";
            boss.roamState = "hovering";
            boss.hoverTimer = 0.3;
        }
    }
}

// 女王バチ専用の「ダッシュ→静止」移動(虫らしい断続的な動き)。画面下半分近くまで広く動き回る。
function updateQueenBeeMovement(dt) {
    if (!boss.roamState) { boss.roamState = "hovering"; boss.hoverTimer = 0.3; }
    const margin = 40;
    if (boss.roamState === "hovering") {
        boss.hoverTimer -= dt;
        if (boss.hoverTimer <= 0) {
            boss.roamTargetX = margin + Math.random() * (canvas.width - margin*2);
            boss.roamTargetY = 80 + Math.random() * (canvas.height*0.55);
            boss.roamState = "dashing";
        }
    } else {
        const dx = boss.roamTargetX - boss.x, dy = boss.roamTargetY - boss.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 6) {
            boss.x = boss.roamTargetX; boss.y = boss.roamTargetY;
            boss.roamState = "hovering";
            boss.hoverTimer = 0.4 + Math.random()*0.4;
        } else {
            boss.x += (dx/dist) * QUEEN_DASH_SPEED * dt;
            boss.y += (dy/dist) * QUEEN_DASH_SPEED * dt;
        }
    }
}

function updateBoss(dt, now) {
    if (boss.state === "entering") {
        updateBossEntrance(dt);
        return;
    }
    boss.timer += dt; boss.attackTimer += dt;

    if (boss.def.entranceType === "fadeIn") {
        updateQueenBeeMovement(dt); // 女王バチは専用のダッシュ&ホバー移動
    } else {
        boss.x += BOSS_DRIFT_SPEED * boss.dir * dt;
        if (boss.x > canvas.width - boss.w*0.3 || boss.x < boss.w*0.3) boss.dir *= -1;
    }

    // ボス固有の弾幕テレグラフ(予告演出)の経過は、移動状態(ダッシュ中等)に関わらず必ず進行させる。
    // ここで解決しないと、ホバー→ダッシュへ切り替わった瞬間に予告済みの弾が発射されなくなってしまう。
    if (!boss.telegraphs) boss.telegraphs = [];
    for (let i = boss.telegraphs.length - 1; i >= 0; i--) {
        const tg = boss.telegraphs[i];
        tg.t -= dt;
        if (tg.t <= 0) { tg.onFire(); boss.telegraphs.splice(i, 1); }
    }

    // 重要ルール: 女王バチはダッシュ中(移動中)は攻撃しない。ホバー(静止)中のみ攻撃可能。
    if (boss.def.entranceType === "fadeIn" && boss.roamState !== "hovering") return;

    const interval = bossPhase === 1 ? 1.0 : (bossPhase === 2 ? 0.65 : 0.4);
    if (boss.attackTimer > interval) {
        boss.attackTimer = 0;
        const bx = boss.x, by = boss.y + boss.h/2;
        // ボスごとの固有パターン(アーキタイプに沿った弾幕形状)。bossPhaseは各関数内で間隔/弾数の強度倍率として作用する。
        if (stageNum === 1) bossAttackSeaDragon(bx, by);
        else if (stageNum === 2) bossAttackWhiteTiger(bx, by);
        else bossAttackQueenBee(bx, by);

        // Hardループ限定の追加パターン: 全ボス共通(ボス固有パターン実装と衝突しないよう追加のみで既存ロジックは変更しない)。
        // 全幅に広がる狙い撃ち扇状弾を確率で追加し、通常戦闘に緊張感を上乗せする。
        if (isHardMode() && Math.random() < 0.4) {
            for (let a=-3;a<=3;a++) {
                const dx = (player.x - bx) + a*22, dy = (player.y - by);
                const len = Math.max(1, Math.hypot(dx,dy));
                enemyBullets.push({ x: bx, y: by, w: 6, h: 14, vx: dx/len*150, vy: dy/len*150 });
            }
        }
    }
}

function draw(dt) {
    ctx.save();
    if (shake > 0) ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);
    drawBackground(dt);

    // パーティクル(柔らかい放射状グラデーションで煙・爆発らしさを表現)
    particles.forEach(p => {
        const r = Math.max(0.5, p.size * 1.8);
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        grad.addColorStop(0, p.color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = p.life;
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // 爆発スプライトアニメーション(4フレームの画像アセットが全て読み込めている時のみ、上記パーティクルに重ねて描画)
    // フレームごとに切り抜きサイズ(縦横比)が異なるため、各フレームの自然な縦横比を保ったまま
    // インスタンスのsize(目標サイズ)に合わせてスケールし、(x,y)を中心に描画する。
    if (explosionFramesReady()) {
        explosionAnims.forEach(ea => {
            const f = EXPLOSION_FRAMES[ea.frame];
            if (!f) return;
            const img = f.img;
            const scale = ea.size / Math.max(img.width, img.height);
            const dw = img.width * scale, dh = img.height * scale;
            ctx.drawImage(img, ea.x - dw/2, ea.y - dh/2, dw, dh);
        });
    }

    // プレイヤー
    if (player.ship) {
        const flashing = player.invuln > 0 && Math.floor(Date.now()/80)%2===0;
        if (!flashing) {
            if (player.ship.imgLoaded) {
                const img = player.ship.outlineImg || player.ship.img;
                const rh = 56, rw = rh * (img.width / img.height);
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(img, player.x + player.w/2 - rw/2, player.y + player.h/2 - rh/2, rw, rh);
                ctx.imageSmoothingEnabled = false;
            } else {
                const s = player.ship.sprite, scale = 1.7;
                drawSprite(s, player.x - (s.w*scale - player.w)/2, player.y - (s.h*scale - player.h)/2, scale, false);
            }
        }
    }

    // 敵(画像アセットがあればそれを描画、失敗/未指定時は既存のドット絵spriteにフォールバック)
    enemies.forEach(e => {
        const def = ENEMY_DEFS[e.type];
        if (def.imgLoaded) {
            const img = def.outlineImg || def.img;
            const rh = e.h, rw = rh * (img.width / img.height);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(img, e.x - rw/2, e.y - rh/2, rw, rh);
            ctx.imageSmoothingEnabled = false;
        } else {
            const s = ENEMY_SPRITES[def.spriteKey], scale = e.w / s.w;
            drawSprite(s, e.x - e.w/2, e.y - e.h/2, scale, false);
        }
    });

    if (boss) {
        ctx.save();
        ctx.translate(boss.x, boss.y);
        if (boss.rotation) ctx.rotate(boss.rotation); // 海竜の登場演出: ミラーではなく180度回転で非対称な頭部の向きを保つ
        if (boss.def.imgLoaded) {
            const img = boss.def.outlineImg || boss.def.img;
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(img, -boss.w/2, -boss.h/2, boss.w, boss.h);
            ctx.imageSmoothingEnabled = false;
        } else {
            const s = boss.def.sprite, scale = boss.w / s.w;
            drawSprite(s, -boss.w/2, -boss.h/2, scale, false);
        }
        if (boss.state === "battle") {
            // 破壊された武装パーツは暗く塗りつぶして視覚的にフィードバック(新規画像素材なし)
            boss.weapons.forEach(wpn => {
                if (!wpn.destroyed) return;
                const r = regionLocalRect(wpn, boss.w, boss.h);
                ctx.fillStyle = "rgba(10,10,10,0.55)";
                ctx.fillRect(r.x, r.y, r.w, r.h);
            });
        }
        ctx.restore();

        if (boss.state === "entering") {
            // CAUTION警告バナー(点滅・画像素材なしでcanvas描画のみ)
            const blinkOn = Math.floor(Date.now()/250) % 2 === 0;
            if (blinkOn) {
                ctx.save();
                ctx.fillStyle = "rgba(255,40,40,0.75)";
                ctx.fillRect(0, canvas.height*0.42, canvas.width, 34);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("CAUTION", canvas.width/2, canvas.height*0.42 + 24);
                ctx.restore();
            }
        } else {
            const blink = Math.floor(Date.now()/150)%2===0;
            if (blink) { ctx.fillStyle = "#ff0"; ctx.fillRect(boss.x-2, boss.y+boss.h*0.15, 4, 4); }
        }

        // ボス固有攻撃のテレグラフ(予告)演出: マズルフラッシュ/着弾バラージの警告リング。
        // ワールド座標を直接使うため、ボスのtranslate/rotateブロックの外(restore後)で描く。
        if (boss.telegraphs) {
            boss.telegraphs.forEach(tg => {
                const p = 1 - tg.t / tg.total;
                if (tg.kind === "muzzle") {
                    if (muzzleFlashFramesReady()) {
                        // t/totalの進行度pを3フレームに割り付ける(0～1を3等分し、0→1→2と進む)
                        const frameIdx = Math.min(MUZZLE_FLASH_FRAMES.length - 1, Math.floor(p * MUZZLE_FLASH_FRAMES.length));
                        const frame = MUZZLE_FLASH_FRAMES[frameIdx];
                        const muzzleSize = 16; // 銃口の閃光として一瞬光る程度の固定サイズ(既存の円演出の見た目規模を踏襲)
                        const aspect = frame.img.naturalWidth / frame.img.naturalHeight || 1;
                        let dw = muzzleSize, dh = muzzleSize;
                        if (aspect >= 1) { dh = muzzleSize / aspect; } else { dw = muzzleSize * aspect; }
                        ctx.drawImage(frame.img, tg.x - dw/2, tg.y - dh/2, dw, dh);
                    } else {
                        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - p)})`;
                        ctx.beginPath(); ctx.arc(tg.x, tg.y, 3 + p*5, 0, Math.PI*2); ctx.fill();
                    }
                } else if (tg.kind === "barrage") {
                    ctx.strokeStyle = `rgba(255,90,40,${0.5 + 0.4*Math.sin(p*24)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(tg.x, tg.y, 8 + p*28, 0, Math.PI*2); ctx.stroke();
                }
            });
        }
    }

    // アイテム
    items.forEach(it => {
        const colors = { power:"#0af", bomb:"#f55", life:"#3f3", score:"#fa0" };
        ctx.fillStyle = colors[it.type] || "#fff";
        ctx.beginPath(); ctx.arc(it.x+7, it.y+7, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.font = "9px Courier New"; ctx.textAlign = "center";
        const labels = { power:"P", bomb:"B", life:"L", score:"$" };
        ctx.fillText(labels[it.type]||"?", it.x+7, it.y+10);
    });

    // 弾
    player.bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 6; ctx.shadowColor = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    ctx.shadowBlur = 0;
    // 敵弾: 種別ごとの色指定(eb.color)があれば使用(White Tigerの重榴弾/機関砲、Queen Beeのホーミング弾等)、無ければ既定の赤
    enemyBullets.forEach(eb => { ctx.fillStyle = eb.color || "#f33"; ctx.fillRect(eb.x-eb.w/2, eb.y-eb.h/2, eb.w, eb.h); });

    if (bombFlashT > 0) { ctx.fillStyle = `rgba(255,220,150,${bombFlashT})`; ctx.fillRect(0,0,canvas.width,canvas.height); }

    ctx.restore();
}

function gameLoop(timestamp) {
    if (gameState !== "PLAY" && gameState !== "STAGE_CLEAR_WAIT") return;
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = timestamp;
    update(dt, timestamp);
    draw(dt);
    requestAnimationFrame(gameLoop);
}

function endGame(cleared) {
    gameState = "RESULT";
    sfx.gameOver();
    if (score > highScore) { highScore = score; localStorage.setItem("skyRaiders1945HighScore", String(highScore)); }
    document.getElementById("highscore").innerText = highScore;
    document.getElementById("result-screen").style.display = "flex";
    document.getElementById("result-msg").innerText = cleared ? "MISSION COMPLETE" : "GAME OVER";
    const isNewRecord = score >= highScore && score > 0;
    document.getElementById("final-stats").innerHTML =
        `SCORE: ${score} ${isNewRecord ? '<span style="color:#fa0">NEW RECORD!</span>' : ''}<br>STAGE: ${stageNum}<br>HIGH SCORE: ${highScore}`;
}
</script>
